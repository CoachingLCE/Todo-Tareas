function runImport(){
  const listId = document.getElementById('import-list').value;
  if(!listId){ alert('Creá una lista primero.'); return; }
  const chosenDate = document.getElementById('import-date').value || null;
  const pendingLines = document.getElementById('import-pending').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const doneLines = document.getElementById('import-done').value.split('\n').map(s=>s.trim()).filter(Boolean);
  let maxOrder = Math.max(0, ...state.tasks.filter(t=>t.listId===listId).map(t=>t.order||0));

  pendingLines.forEach(title=>{
    maxOrder++;
    state.tasks.push({ id: uid(), listId, title, done:false, priority:null, tags:[], subtasks:[], notes:'',
      dueDate:chosenDate, createdAt:Date.now(), completedAt:null, order:maxOrder, recurrence:null, reminderDaysBefore:null, reminders:[] });
  });
  doneLines.forEach(title=>{
    maxOrder++;
    state.tasks.push({ id: uid(), listId, title, done:true, priority:null, tags:[], subtasks:[], notes:'',
      dueDate:chosenDate, createdAt:Date.now(), completedAt:chosenDate||todayISO(), order:maxOrder, recurrence:null, reminderDaysBefore:null, reminders:[] });
    state.totalCompletedEver = (state.totalCompletedEver||0) + 1;
  });

  closeModal();
  state.currentView = {type:'list', id:listId};
  saveState(); render();
  showToast(`Importadas ${pendingLines.length + doneLines.length} tareas`);
}

function renderPomodoroHtml(){
  const m = Math.floor(pomodoro.secondsLeft/60), s = pomodoro.secondsLeft%60;
  return `<div class="pomodoro-panel">
    <div class="pomodoro-mode">${pomodoro.mode==='focus'?'Foco':'Descanso'}</div>

      <button class="btn" onclick="pomodoroReset()">Reiniciar</button>
    </div>
  </div>`;
}
function pomodoroToggle(){
  pomodoro.running = !pomodoro.running;
  if(pomodoro.running){
    pomodoro.timer = setInterval(()=>{
      pomodoro.secondsLeft--;
      if(pomodoro.secondsLeft <= 0){
        if(pomodoro.mode==='focus') recordFocusSession(25);
        pomodoro.mode = pomodoro.mode==='focus' ? 'break' : 'focus';
        pomodoro.secondsLeft = pomodoro.mode==='focus' ? 25*60 : 5*60;
        showToast(pomodoro.mode==='focus' ? '¡Descanso terminado! A concentrarse.' : '¡25 minutos completos! Tomate un descanso.');

      const t = document.getElementById('pomodoro-time');
      if(t){ const m=Math.floor(pomodoro.secondsLeft/60), s=pomodoro.secondsLeft%60; t.innerText = `${pad2(m)}:${pad2(s)}`; }
    }, 1000);
  } else {
    clearInterval(pomodoro.timer);
  }
  document.getElementById('pomodoro-container').innerHTML = renderPomodoroHtml();
}
/** Guarda una sesión de foco completada (para mostrar el tiempo total en Estadísticas). */

  if(!state.focusSessions) state.focusSessions = [];
  state.focusSessions.push({ date: todayISO(), minutes });

}
function pomodoroReset(){
  clearInterval(pomodoro.timer);
  pomodoro = { running:false, secondsLeft:25*60, mode:'focus', timer:null };
  document.getElementById('pomodoro-container').innerHTML = renderPomodoroHtml();
}

}
function dateLabelFor(dateStr, done){
  if(!dateStr) return null;
  const t0 = todayISO();
  if(dateStr === t0) return {text:'Hoy', cls:'today'};
  if(dateStr < t0 && !done) return {text:'Vencida · '+dateStr, cls:'overdue'};
  const tmr = new Date(); tmr.setDate(tmr.getDate()+1);
  if(dateStr === toISO(tmr)) return {text:'Mañana', cls:''};
  return {text: dateStr, cls:''};
}

/** Texto tipo "Completada hoy a las 14:35" para mostrar en tareas ya terminadas. */
function formatCompletedWhen(t){
  if(!t.completedAtTime) return t.completedAt ? `Completada el ${t.completedAt}` : null;
  const d = new Date(t.completedAtTime);
  const timeLabel = pad2(d.getHours())+':'+pad2(d.getMinutes());
  const t0 = todayISO();
  let dayLabel;
  if(t.completedAt === t0) dayLabel = 'hoy';
  else if(t.completedAt === yesterdayISO()) dayLabel = 'ayer';
  else dayLabel = `el ${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`;
  return `Completada ${dayLabel} a las ${timeLabel}`;
}

/* =====================================================================
   ASISTENTE DIARIO (tarjeta de bienvenida con insights)
   ===================================================================== */
function tomorrowISO(){ const d = new Date(); d.setDate(d.getDate()+1); return toISO(d); }

/** Racha de días consecutivos completando al menos una tarea (compartido con Estadísticas). */
function computeStreak(){
  const byDate = {};
  state.tasks.filter(t=>t.done && t.completedAt).forEach(t=>{ byDate[t.completedAt] = (byDate[t.completedAt]||0)+1; });
  let streak = 0, cursor = new Date();
  while(true){
    const iso = toISO(cursor);
    if(byDate[iso]){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
  }
  return streak;
}
function getWeekRange(offsetWeeks){
  offsetWeeks = offsetWeeks || 0;
  const now = new Date(); now.setDate(now.getDate() + offsetWeeks*7);
  const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  const end = new Date(start); end.setDate(start.getDate()+6);
  return { startISO: toISO(start), endISO: toISO(end) };
}

/** Pool de mensajes variados según el contexto del día — evita repetir siempre lo mismo. */
const SMART_MESSAGE_POOLS = {
  none: ['¡Excelente! No tenés tareas pendientes para hoy.', '🎉 Día libre de tareas. Buen momento para planificar algo lindo.'],
  overdue: ['Tenés varias tareas vencidas. Conviene resolverlas antes de agregar nuevas.', 'Hay tareas atrasadas esperando — priorizalas hoy si podés.'],
  busy: ['Hoy tenés bastante trabajo. Te recomiendo empezar por las tareas de prioridad alta.', 'Día cargado — andá de a una, empezando por lo más urgente.'],
  light: ['Hoy es un día tranquilo, no tenés muchas tareas.', 'Poco en la agenda hoy — buen momento para adelantar algo de mañana.'],
  streak: ['Llevás una buena racha completando tareas — no la cortes hoy.', '¡Racha activa! Sumá una tarea más para seguir la cadena.'],
  normal: ['Vamos por un gran día.', 'Un paso a la vez, todo suma.', 'Buen momento para poner en marcha el día.']
};
function pickSmartMessage(pendingToday, overdueCount, streak){
  let pool;
  if(pendingToday===0) pool = SMART_MESSAGE_POOLS.none;
  else if(overdueCount>0) pool = SMART_MESSAGE_POOLS.overdue;
  else if(pendingToday>=8) pool = SMART_MESSAGE_POOLS.busy;
  else if(streak>=3) pool = SMART_MESSAGE_POOLS.streak;
  else if(pendingToday<=3) pool = SMART_MESSAGE_POOLS.light;
  else pool = SMART_MESSAGE_POOLS.normal;
  return pool[Math.floor(Math.random()*pool.length)];
}

function renderDayProgress(){
  const t0 = todayISO();
  const tmr = tomorrowISO();
  const prioOrder = {alta:0, media:1, baja:2, null:3, undefined:3};

  const todayTasks = state.tasks.filter(t=> t.dueDate===t0 || (t.done && t.completedAt===t0));
  const pendingToday = state.tasks.filter(t=>!t.done && t.dueDate===t0);
  const doneToday = todayTasks.filter(t=>t.done).length;
  const total = todayTasks.length;
  const pct = total ? Math.round((doneToday/total)*100) : 0;
  const highTodayCount = pendingToday.filter(t=>t.priority==='alta').length;
  const overdueCount = state.tasks.filter(isOverdue).length;
  const yesterdayCount = state.tasks.filter(t=>t.done && t.completedAt===yesterdayISO()).length;
  const tomorrowCount = state.tasks.filter(t=>!t.done && t.dueDate===tmr).length;
  const streak = computeStreak();

  // Insights automáticos
  const mostImportant = [...pendingToday].sort((a,b)=>(prioOrder[a.priority]??3)-(prioOrder[b.priority]??3))[0];
  const nextDeadline = state.tasks.filter(t=>!t.done && t.dueDate && t.dueDate>t0).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
  const { startISO: weekStart, endISO: weekEnd } = getWeekRange(0);
  const weekTasks = state.tasks.filter(t=>t.dueDate && t.dueDate>=weekStart && t.dueDate<=weekEnd);
  const weekPendingCount = weekTasks.filter(t=>!t.done).length;
  const weekDoneCount = weekTasks.filter(t=>t.done).length;
  const weekCompletionPct = weekTasks.length ? Math.round((weekDoneCount/weekTasks.length)*100) : null;
  const estimatedMinutesToday = pendingToday.reduce((sum,t)=>sum+(t.estimatedMinutes||0), 0);
  const lastWeek = getWeekRange(-1);
  const lastWeekDone = state.tasks.filter(t=>t.done && t.completedAt>=lastWeek.startISO && t.completedAt<=lastWeek.endISO).length;
  const vsYesterday = doneToday - yesterdayCount;

  if(streak>=2){ /* la racha ya se muestra en Estadísticas destacada */ }

  const insights = [];
  if(mostImportant) insights.push(`🎯 Más importante: <strong>${escapeHtml(mostImportant.title)}</strong>`);
  if(nextDeadline) insights.push(`📌 Próximo vencimiento: <strong>${escapeHtml(nextDeadline.title)}</strong> (${nextDeadline.dueDate})`);
  insights.push(`📅 Quedan <strong>${weekPendingCount}</strong> para la semana`);
  if(estimatedMinutesToday>0) insights.push(`⏱️ Estimado hoy: <strong>${estimatedMinutesToday} min</strong>`);
  if(yesterdayCount>0 || doneToday>0) insights.push(vsYesterday>0 ? `📈 ${vsYesterday} mejor que ayer` : vsYesterday<0 ? `📉 ${Math.abs(vsYesterday)} menos que ayer` : `➖ Mismo ritmo que ayer`);
  if(lastWeekDone>0 || weekDoneCount>0) insights.push(`🗓️ Esta semana: <strong>${weekDoneCount}</strong> · pasada: ${lastWeekDone}`);
  if(weekCompletionPct!==null) insights.push(`✅ Cumplimiento semanal: <strong>${weekCompletionPct}%</strong>`);

  const suggestion = mostImportant ? `Sugerencia: empezá por "<strong>${escapeHtml(mostImportant.title)}</strong>"${mostImportant.dueDate===t0?' porque vence hoy':''}.` : '';

  const hour = new Date().getHours();
  const greeting = hour>=5 && hour<12 ? 'Buenos días' : hour>=12 && hour<19 ? 'Buenas tardes' : 'Buenas noches';
  const barsHtml = `<div class="dpc-progress-wrap"><div class="dpc-progress-bar" style="width:${pct}%"></div></div>`;

  document.getElementById('day-progress-container').innerHTML = `
    <div class="day-progress-card">
      <div class="dpc-greeting dpc-collapsible">${greeting}.</div>
      <div class="dpc-hero dpc-collapsible">
        <div class="dpc-hero-item"><div class="num">${pendingToday.length}</div><div class="label">tarea${pendingToday.length===1?'':'s'} hoy</div></div>
        <div class="dpc-hero-item"><div class="num" style="color:${highTodayCount>0?'var(--high)':'inherit'}">${highTodayCount}</div><div class="label">importante${highTodayCount===1?'':'s'}</div></div>
        <div class="dpc-hero-item"><div class="num" style="color:${overdueCount>0?'var(--high)':'inherit'}">${overdueCount}</div><div class="label">vencida${overdueCount===1?'':'s'}</div></div>
        <div class="dpc-hero-item"><div class="num" style="color:${doneToday>0?'var(--success)':'inherit'}">${doneToday}</div><div class="label">completada${doneToday===1?'':'s'}</div></div>
      </div>
      <div class="dpc-progress-row">
        <div class="dpc-collapsible" style="flex:1;display:flex;">${barsHtml}</div>
        <span class="dpc-progress-pct">${pct}%</span>
      </div>
      <div class="dpc-msg dpc-collapsible">${pickSmartMessage(pendingToday.length, overdueCount, streak)}</div>
      ${tomorrowCount>0 ? `<div class="dpc-collapsible" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-2);">
        <span>${icon('calendarDays',14)} Para mañana ya tenés ${tomorrowCount} tarea${tomorrowCount===1?'':'s'} programada${tomorrowCount===1?'':'s'}.</span>
        <button class="btn" style="font-size:12px;padding:5px 12px;" onclick="selectView('tomorrow', null)">Ver mañana</button>
      </div>` : ''}
      <button class="expand-btn dpc-collapsible" style="margin-top:12px;" onclick="toggleDashboardDetails()">${dashboardDetailsOpen ? 'Ocultar detalles' : 'Ver más detalles'}</button>

/** Botón de IA: prioriza, reprograma vencidas, agrupa y detecta bloqueos entre las tareas de hoy. */
async function organizeMyDay(){
  const t0 = todayISO();
  const relevant = state.tasks.filter(t=>!t.done && (t.dueDate===t0 || isOverdue(t)));
  if(relevant.length===0){ showToast('No hay tareas pendientes de hoy para organizar.'); return; }

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h2>${icon('sparkles',18)} Organizando tu día</h2>
        <div id="organize-result" class="ai-result-box">Analizando ${relevant.length} tarea(s)...</div>
      </div>
    </div>`;

  const indexed = relevant.map((t,i)=>({ index:i, title:t.title, priority:t.priority||null, dueDate:t.dueDate, notes:t.notes||'' }));
  const prompt = `Hoy es ${t0}. Estas son las tareas pendientes de hoy de un usuario (índice, título, prioridad actual, fecha, notas):
${JSON.stringify(indexed)}

Ayudame a organizar el día:
1) Sugerí una prioridad (alta, media o baja) para cada una según la urgencia/importancia que sugiere el título.
2) Si alguna está vencida y no parece crítica, sugerí una nueva fecha razonable (aaaa-mm-dd).
3) Marcá como "bloqueada" (blocked:true) las que dependen de otra persona o de otra tarea (ej: "esperar a...", "pedirle a...", "una vez que...").
4) Agrupá las tareas relacionadas en 2 a 4 grupos temáticos cortos.

Respondé ÚNICAMENTE con este JSON (sin texto adicional ni markdown):
{"tasks":[{"index":0,"priority":"alta","dueDate":null,"blocked":false,"blockedReason":null}],"groups":[{"label":"...","indices":[0,1]}]}`;

  try{
    const raw = await callClaude(prompt, 1000);
    const data = JSON.parse(cleanJson(raw));
    window.__organizeData = { relevant, data };
    renderOrganizePreview();
  }catch(e){
    document.getElementById('organize-result').innerHTML = 'No se pudo analizar. Probá de nuevo en un momento.';
  }
}

function renderOrganizePreview(){
  const { relevant, data } = window.__organizeData;
  const groupByIndex = {};
  (data.groups||[]).forEach(g=> g.indices.forEach(i=> groupByIndex[i]=g.label));

  const rows = (data.tasks||[]).map(s=>{
    const t = relevant[s.index];
    if(!t) return '';
    const bits = [];
    if(s.priority && s.priority !== t.priority) bits.push(`prioridad → <strong>${s.priority}</strong>`);
    if(s.dueDate && s.dueDate !== t.dueDate) bits.push(`fecha → <strong>${s.dueDate}</strong>`);
    if(s.blocked) bits.push(`⛔ posible bloqueo${s.blockedReason?': '+escapeHtml(s.blockedReason):''}`);
    if(groupByIndex[s.index]) bits.push(`grupo: <strong>${escapeHtml(groupByIndex[s.index])}</strong>`);
    if(bits.length===0) return '';
    return `<div class="organize-suggestion-row">
      <input type="checkbox" id="org-item-${s.index}" checked style="margin-top:3px;">
      <div><div style="font-weight:500;">${escapeHtml(t.title)}</div><div style="color:var(--text-muted);margin-top:2px;">${bits.join(' · ')}</div></div>
    </div>`;
  }).join('');

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h2>${icon('sparkles',18)} Propuesta para hoy</h2>
        ${rows || '<div class="empty">No hay cambios sugeridos, ya está todo bastante ordenado 👍</div>'}
        <div class="modal-actions">
          <div></div>
          <div class="right">
            <button class="btn" onclick="closeModal()">Cancelar</button>
            <button class="btn primary" onclick="applyOrganizeSuggestions()">Aplicar seleccionadas</button>
          </div>
        </div>
      </div>
    </div>`;
}

function applyOrganizeSuggestions(){
  const { relevant, data } = window.__organizeData;
  const groupByIndex = {};
  (data.groups||[]).forEach(g=> g.indices.forEach(i=> groupByIndex[i]=g.label));
  let applied = 0;
  (data.tasks||[]).forEach(s=>{
    const cb = document.getElementById('org-item-'+s.index);
    if(!cb || !cb.checked) return;
    const t = relevant[s.index];
    if(!t) return;
    if(s.priority) t.priority = s.priority;
    if(s.dueDate) t.dueDate = s.dueDate;
    if(s.blocked && !t.tags.includes('bloqueada')) t.tags.push('bloqueada');
    const group = groupByIndex[s.index];
    if(group && !t.tags.includes(group)) t.tags.push(group);
    applied++;
  });
  window.__organizeData = null;
  closeModal();
  saveState(); render();
  showToast(`Se organizaron ${applied} tarea${applied===1?'':'s'}`);
}

/* =====================================================================
   RENDER: TARJETA DE TAREA
   ===================================================================== */
function renderTaskCard(t){
  const list = state.lists.find(l=>l.id===t.listId);
  const isExpanded = !!expanded[t.id];
  const subDoneCount = t.subtasks.filter(s=>s.done).length;
  const subPct = t.subtasks.length ? Math.round((subDoneCount/t.subtasks.length)*100) : 0;
  const dateInfo = dateLabelFor(t.dueDate, t.done);
  const recurLabel = t.recurrence ? (t.recurrence.type==='daily'?'🔁 diaria':t.recurrence.type==='weekly'?'🔁 semanal':t.recurrence.type==='monthly'?'🔁 mensual':`🔁 cada ${t.recurrence.interval}d`) : '';
  const isSelected = selectedIds.has(t.id);
  const prioClass = t.priority ? 'prio-'+t.priority : '';

  return `
  <div class="task ${t.done?'done':''} ${prioClass} ${isSelected?'selected':''} ${t.id===justAddedTaskId?'task-enter':''}" data-task-id="${t.id}" draggable="true"
    ondragstart="onTaskDragStart(event,'${t.id}')" ondragover="onTaskDragOver(event,'${t.id}')"
    ondragleave="onTaskDragLeaveCard(event)" ondrop="onTaskDrop(event,'${t.id}')" ondragend="onTaskDragEnd(event)"
    oncontextmenu="openContextMenu(event,'${t.id}')">
    <div class="task-row">
      ${selectMode ? `<div class="select-box ${isSelected?'checked':''}" onclick="toggleSelectTask('${t.id}',event)">${isSelected?'✓':''}</div>` : ''}
      <div class="checkbox ${t.done?'checked':''}" onclick="handleCompleteClick('${t.id}', event)">${t.done?'✓':''}</div>
      <div class="task-body">
        <div class="task-title" onclick="openEditModal('${t.id}')">${escapeHtml(t.title)}</div>
        ${t.done && formatCompletedWhen(t) ? `<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">✓ ${formatCompletedWhen(t)}</div>` : ''}
        <div class="task-meta">
          ${t.priority ? `<span class="badge ${t.priority==='alta'?'high':t.priority==='media'?'med':'low'}" onclick="cyclePriority('${t.id}')" style="cursor:pointer">${priorityIcon(t.priority)} ${priorityLabel(t.priority)}</span>` : `<span class="badge low" style="opacity:.4;cursor:pointer" onclick="cyclePriority('${t.id}')">Sin prioridad</span>`}
          ${dateInfo ? `<span class="date-badge ${dateInfo.cls}">📅 ${dateInfo.text}</span>` : ''}
          ${t.estimatedMinutes ? `<span class="date-badge">⏱️ ${t.estimatedMinutes} min</span>` : ''}
          ${recurLabel ? `<span class="recur-badge">${recurLabel}</span>` : ''}
          ${state.currentView.type!=='list' ? `<span class="tag" style="color:${list?list.color:'#888'}">${list?escapeHtml(list.name):''}</span>` : ''}
          ${t.tags.map(tag=>`<span class="tag">${escapeHtml(tag)} <span style="cursor:pointer" onclick="removeTag('${t.id}','${tag}')">✕</span></span>`).join('')}
        </div>
        ${t.subtasks.length ? `<div class="progress-bar-wrap"><div class="progress-bar" style="width:${subPct}%"></div></div>` : ''}
        ${!isExpanded ? `<button class="expand-btn" onclick="toggleExpand('${t.id}')">${t.subtasks.length ? `Subtareas (${subDoneCount}/${t.subtasks.length})` : 'Agregar detalle'}</button>` : ''}
        ${isExpanded ? `
          <div class="subtasks">
            ${t.subtasks.map(s=>`
              <div class="subtask-row ${s.done?'done':''}" draggable="true" ondragstart="onSubDragStart(event,'${t.id}','${s.id}')" ondragover="event.preventDefault()" ondrop="onSubDrop(event,'${t.id}','${s.id}')">
                <div class="checkbox ${s.done?'checked':''}" onclick="toggleSubtask('${t.id}','${s.id}')">${s.done?'✓':''}</div>
                <span>${escapeHtml(s.title)}</span>
                <span style="cursor:pointer;color:var(--text-muted);margin-left:auto" onclick="deleteSubtask('${t.id}','${s.id}')">✕</span>
              </div>`).join('')}
            <div class="add-sub">
              <input type="text" id="sub-input-${t.id}" placeholder="Nueva subtarea" onkeydown="if(event.key==='Enter')addSubtask('${t.id}')">
              <button onclick="addSubtask('${t.id}')">Agregar</button>
            </div>
            <div class="add-tag-row">
              <input type="text" id="tag-input-${t.id}" placeholder="Nueva etiqueta" onkeydown="if(event.key==='Enter')addTag('${t.id}')">
              <button onclick="addTag('${t.id}')">Etiquetar</button>
            </div>
            ${t.notes ? `<div style="font-size:12px;color:var(--text-2);margin-top:9px;white-space:pre-wrap;">${escapeHtml(t.notes)}</div>` : ''}
            <button class="expand-btn" onclick="toggleExpand('${t.id}')">Ocultar</button>
          </div>
        ` : ''}
      </div>
      <div class="task-actions">
        <button class="icon-btn" onclick="openEditModal('${t.id}')" title="Editar">✎</button>
        <button class="icon-btn" onclick="deleteTask('${t.id}')" title="Eliminar">✕</button>
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   RENDER: ESTADÍSTICAS (con gráficos)
   ===================================================================== */
let statsCharts = [];
function destroyStatsCharts(){ statsCharts.forEach(c=>c.destroy()); statsCharts = []; }

function renderStats(container){
  destroyStatsCharts();
  const created = state.tasks.length;
  const doneTasks = state.tasks.filter(t=>t.done && t.completedAt);
  const completedCount = doneTasks.length;
  const pct = created ? Math.round((completedCount/created)*100) : 0;
  const overdueCount = state.tasks.filter(isOverdue).length;

  const byDate = {};
  doneTasks.forEach(t=>{ byDate[t.completedAt] = (byDate[t.completedAt]||0) + 1; });
  const dates = Object.keys(byDate).sort();
  const avgDaily = dates.length ? Math.round((completedCount/dates.length)*10)/10 : 0;

  const streak = computeStreak();

  const focusSessions = state.focusSessions || [];
  const t0 = todayISO();
  const { startISO: weekStartISO } = getWeekRange(0);
  const focusTotalMinutes = focusSessions.reduce((s,f)=>s+f.minutes, 0);
  const focusTodayMinutes = focusSessions.filter(f=>f.date===t0).reduce((s,f)=>s+f.minutes, 0);
  const focusWeekMinutes = focusSessions.filter(f=>f.date>=weekStartISO).reduce((s,f)=>s+f.minutes, 0);
  const focusSessionsCount = focusSessions.length;
  const doneToday = doneTasks.filter(t=>t.completedAt===t0).length;

  const byList = {};
  doneTasks.forEach(t=>{ byList[t.listId] = (byList[t.listId]||0)+1; });
  const listRows = state.lists.map(l=>({name:l.name, count: byList[l.id]||0})).sort((a,b)=>b.count-a.count);

  const last7 = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); last7.push(toISO(d)); }
  const weekCounts = last7.map(d=>byDate[d]||0);

  const monthLabels = [], monthCounts = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    const label = d.toLocaleDateString('es-AR',{month:'short'});
    const prefix = d.getFullYear()+'-'+pad2(d.getMonth()+1);
    monthLabels.push(label);
    monthCounts.push(dates.filter(dd=>dd.startsWith(prefix)).reduce((s,dd)=>s+byDate[dd],0));
  }

  const withEstimate = state.tasks.filter(t=>t.estimatedMinutes);
  const avgMinutes = withEstimate.length ? Math.round(withEstimate.reduce((s,t)=>s+t.estimatedMinutes,0)/withEstimate.length) : null;
  const avgTimeLabel = avgMinutes ? `${Math.floor(avgMinutes/60)}h ${avgMinutes%60}m` : '—';

  const curWeek = getWeekRange(0);
  const lastWeek = getWeekRange(-1);
  const thisWeekDoneCount = doneTasks.filter(t=>t.completedAt>=curWeek.startISO && t.completedAt<=curWeek.endISO).length;
  const lastWeekDoneCount = doneTasks.filter(t=>t.completedAt>=lastWeek.startISO && t.completedAt<=lastWeek.endISO).length;
  const productivityChange = lastWeekDoneCount>0 ? Math.round(((thisWeekDoneCount-lastWeekDoneCount)/lastWeekDoneCount)*100) : (thisWeekDoneCount>0 ? 100 : 0);

  container.innerHTML = `
    <div class="stats-hero">
      <div class="stats-hero-card"><div class="hero-icon">${icon('flame',22)}</div><div class="hero-num">${streak}</div><div class="hero-label">días de racha</div></div>
      <div class="stats-hero-card"><div class="hero-icon">${icon('clock',22)}</div><div class="hero-num">${avgTimeLabel}</div><div class="hero-label">tiempo promedio</div></div>
      <div class="stats-hero-card"><div class="hero-icon" style="color:${productivityChange>=0?'var(--success)':'var(--high)'}">${icon('trendUp',22)}</div><div class="hero-num" style="color:${productivityChange>=0?'var(--success)':'var(--high)'}">${productivityChange>=0?'+':''}${productivityChange}%</div><div class="hero-label">vs semana pasada</div></div>
    </div>
    <div class="stats-summary">
      <div class="stat-card"><div class="num">${created}</div><div class="label">Tareas creadas</div></div>
      <div class="stat-card"><div class="num">${completedCount}</div><div class="label">Completadas</div></div>
      <div class="stat-card"><div class="num">${pct}%</div><div class="label">Cumplimiento</div></div>
      <div class="stat-card"><div class="num">${overdueCount}</div><div class="label">Vencidas</div></div>
      <div class="stat-card"><div class="num">${avgDaily}</div><div class="label">Promedio diario</div></div>
      <div class="stat-card"><div class="num">${streak}</div><div class="label">Racha de días</div></div>
    </div>
    <div class="chart-card" id="chart-week-card"><canvas id="chart-week"></canvas></div>
    <div class="chart-card" id="chart-month-card"><canvas id="chart-month"></canvas></div>
    <div class="task-group-label">Tiempo de foco (Pomodoro)</div>
    <div class="stats-summary" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card"><div class="num">${focusSessionsCount}</div><div class="label">Sesiones completadas</div></div>
      <div class="stat-card"><div class="num">${Math.floor(focusTotalMinutes/60)}h ${focusTotalMinutes%60}m</div><div class="label">Tiempo total en foco</div></div>
      <div class="stat-card"><div class="num">${focusTodayMinutes}m</div><div class="label">Foco hoy</div></div>
      <div class="stat-card"><div class="num">${focusWeekMinutes}m</div><div class="label">Foco esta semana</div></div>
      <div class="stat-card"><div class="num">${completedCount}</div><div class="label">Tareas hechas</div></div>
      <div class="stat-card"><div class="num">${doneToday}</div><div class="label">Completadas hoy</div></div>
    </div>
    <div class="task-group-label">Productividad por lista</div>
    ${listRows.map(r=>`<div class="stats-row"><span>${escapeHtml(r.name)}</span><div class="bar-wrap"><div class="bar" style="width:${Math.round((r.count/Math.max(1,...listRows.map(x=>x.count)))*100)}%"></div></div><span class="day-count">${r.count}</span></div>`).join('') || '<div class="empty">Todavía no hay datos.</div>'}
  `;

  if(typeof Chart !== 'undefined'){
    const isDark = state.darkMode;
    const gridColor = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
    const textColor = isDark ? '#a3a2ac' : '#6e6d67';
    const weekdayShort = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const weekLabels = last7.map(d=>weekdayShort[new Date(d+'T00:00:00').getDay()]);

    statsCharts.push(new Chart(document.getElementById('chart-week'), {
      type:'bar',
      data:{ labels: weekLabels, datasets:[{ label:'Completadas', data: weekCounts, backgroundColor:'#3b6bf0', borderRadius:6 }] },
      options:{ responsive:true, plugins:{legend:{display:false}, title:{display:true,text:'Productividad semanal',color:textColor}},
        scales:{ x:{ticks:{color:textColor},grid:{display:false}}, y:{ticks:{color:textColor,stepSize:1},grid:{color:gridColor},beginAtZero:true} } }
    }));
    statsCharts.push(new Chart(document.getElementById('chart-month'), {
      type:'bar',
      data:{ labels: monthLabels, datasets:[{ label:'Completadas', data: monthCounts, backgroundColor:'#3f95a8', borderRadius:6 }] },
      options:{ responsive:true, plugins:{legend:{display:false}, title:{display:true,text:'Productividad mensual',color:textColor}},
        scales:{ x:{ticks:{color:textColor},grid:{display:false}}, y:{ticks:{color:textColor,stepSize:1},grid:{color:gridColor},beginAtZero:true} } }
    }));
  } else {
    // Respaldo sin dependencias externas: si Chart.js no cargó (sin internet, CSP, etc.),
    // mostramos barras simples hechas con CSS para que la sección nunca quede vacía.
    const weekdayShort = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const weekLabels = last7.map(d=>weekdayShort[new Date(d+'T00:00:00').getDay()]);
    renderCssBarChart('chart-week-card', 'Productividad semanal', weekLabels, weekCounts);
    renderCssBarChart('chart-month-card', 'Productividad mensual', monthLabels, monthCounts);
  }
}

/** Gráfico de barras simple en CSS puro, usado cuando Chart.js no está disponible. */
function renderCssBarChart(containerId, title, labels, values){
  const max = Math.max(1, ...values);
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = `
    <div class="task-group-label" style="margin-top:0;">${title}</div>
    <div style="display:flex;align-items:flex-end;gap:10px;height:140px;padding:0 4px;">
      ${values.map((v,i)=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">${v||''}</div>
          <div style="width:70%;background:var(--accent);border-radius:5px 5px 0 0;height:${Math.max(2, Math.round((v/max)*100))}%;"></div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">${escapeHtml(labels[i])}</div>
        </div>`).join('')}
    </div>`;
}

/* =====================================================================
   RENDER: CALENDARIO
   ===================================================================== */
function changeMonth(delta){ calDate.setMonth(calDate.getMonth()+delta); render(); }
function onCalDragOver(evt){ evt.preventDefault(); evt.currentTarget.classList.add('drag-over'); }
function onCalDragLeave(evt){ evt.currentTarget.classList.remove('drag-over'); }
function onCalDrop(evt, dateISO){
  evt.preventDefault();
  evt.currentTarget.classList.remove('drag-over');
  if(!draggedTaskId) return;
  const t = state.tasks.find(t=>t.id===draggedTaskId);
  if(t){ t.dueDate = dateISO; saveState(); render(); showToast('Fecha actualizada'); }
  draggedTaskId = null;
}
function calChipClass(t){
  let cls = t.priority==='alta'?'high':t.priority==='media'?'med':'';
  if(t.done) cls += ' done';
  if(isOverdue(t)) cls += ' overdue';
  return cls;
}
function renderCalendar(container){
  const year = calDate.getFullYear(), month = calDate.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = calDate.toLocaleDateString('es-AR',{month:'long', year:'numeric'});
  const weekdayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const t0 = todayISO();

  let cells = '';
  for(let i=0;i<startOffset;i++){
    const d = new Date(year, month, 1-startOffset+i);
    cells += `<div class="cal-day other-month"><div class="cal-day-num">${d.getDate()}</div></div>`;
  }
  for(let day=1; day<=daysInMonth; day++){
    const iso = toISO(new Date(year, month, day));
    const dayTasks = state.tasks.filter(t=>t.dueDate===iso).slice(0,4);
    cells += `<div class="cal-day ${iso===t0?'today':''}" ondragover="onCalDragOver(event)" ondragleave="onCalDragLeave(event)" ondrop="onCalDrop(event,'${iso}')">
      <div class="cal-day-num">${day}</div>
      ${dayTasks.map(t=>`<div class="cal-task-chip ${calChipClass(t)}" draggable="true" ondragstart="onTaskDragStart(event,'${t.id}')" ondragend="onTaskDragEnd(event)" onclick="openEditModal('${t.id}')" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</div>`).join('')}
    </div>`;
  }

  container.innerHTML = `
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">←</button>
      <strong style="text-transform:capitalize;">${monthName}</strong>
      <button onclick="changeMonth(1)">→</button>
    </div>
    <div class="calendar-grid">
      ${weekdayNames.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}
      ${cells}
    </div>`;
}

/* =====================================================================
   RENDER: SEMANA
   ===================================================================== */
function changeWeek(delta){ weekDate.setDate(weekDate.getDate()+delta*7); render(); }
function renderWeek(container){
  const start = new Date(weekDate); start.setDate(start.getDate() - start.getDay());
  const weekdayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const t0 = todayISO();
  let cells = '';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const iso = toISO(d);
    const dayTasks = state.tasks.filter(t=>t.dueDate===iso);
    cells += `<div class="cal-day week-day ${iso===t0?'today':''}" ondragover="onCalDragOver(event)" ondragleave="onCalDragLeave(event)" ondrop="onCalDrop(event,'${iso}')">
      <div class="cal-day-num">${weekdayNames[i]} ${d.getDate()}</div>
      ${dayTasks.map(t=>`<div class="cal-task-chip ${calChipClass(t)}" draggable="true" ondragstart="onTaskDragStart(event,'${t.id}')" ondragend="onTaskDragEnd(event)" onclick="openEditModal('${t.id}')" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</div>`).join('')}
    </div>`;
  }
  container.innerHTML = `
    <div class="cal-nav">
      <button onclick="changeWeek(-1)">←</button>
      <strong>Semana del ${toISO(start)}</strong>
      <button onclick="changeWeek(1)">→</button>
    </div>
    <div class="week-grid">${cells}</div>`;
}

/* =====================================================================
   RENDER: KANBAN (columnas por prioridad)
   ===================================================================== */
const KANBAN_COLUMNS = [
  {key:'alta', label:'Alta prioridad', color:'var(--high)'},
  {key:'media', label:'Media prioridad', color:'var(--med)'},
  {key:'baja', label:'Baja prioridad', color:'var(--low)'},
  {key:'none', label:'Sin prioridad', color:'var(--text-muted)'}
];
function onKanbanDragOver(evt){ evt.preventDefault(); evt.currentTarget.classList.add('drag-over'); }
function onKanbanDragLeave(evt){ evt.currentTarget.classList.remove('drag-over'); }
function onKanbanDrop(evt, colKey){
  evt.preventDefault();
  evt.currentTarget.classList.remove('drag-over');
  if(!draggedTaskId) return;
  const t = state.tasks.find(t=>t.id===draggedTaskId);
  if(t){ t.priority = colKey==='none' ? null : colKey; saveState(); render(); }
  draggedTaskId = null;
}
function renderKanban(container){
  const pending = state.tasks.filter(t=>!t.done);
  container.innerHTML = `<div class="kanban-grid">
    ${KANBAN_COLUMNS.map(col=>{
      const items = pending.filter(t=> col.key==='none' ? !t.priority : t.priority===col.key);
      return `<div class="kanban-col" ondragover="onKanbanDragOver(event)" ondragleave="onKanbanDragLeave(event)" ondrop="onKanbanDrop(event,'${col.key}')">
        <div class="kanban-col-header"><span class="dot" style="background:${col.color}"></span>${col.label} (${items.length})</div>
        ${items.map(t=>`<div class="kanban-card" draggable="true" ondragstart="onTaskDragStart(event,'${t.id}')" ondragend="onTaskDragEnd(event)" onclick="openEditModal('${t.id}')">${escapeHtml(t.title)}</div>`).join('') || '<div class="empty" style="padding:8px 0;">Sin tareas</div>'}
      </div>`;
    }).join('')}
  </div>`;
}

/* =====================================================================
   RENDER: AGENDA (vencidas + próximos agrupados por día)
   ===================================================================== */
function renderAgenda(container){
  const t0 = todayISO();
  const overdue = state.tasks.filter(isOverdue);
  const upcoming = state.tasks.filter(t=>!t.done && t.dueDate && t.dueDate >= t0);
  const byDate = {};
  upcoming.forEach(t=>{ (byDate[t.dueDate] = byDate[t.dueDate]||[]).push(t); });
  const dates = Object.keys(byDate).sort();
  const prioOrder = {alta:0, media:1, baja:2, null:3, undefined:3};
  const weekdayNames = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  let html = '';
  if(overdue.length){
    html += `<div class="task-group-label">Vencidas</div>`;
    html += overdue.sort((a,b)=>{ const d=(prioOrder[a.priority]??3)-(prioOrder[b.priority]??3); return d!==0?d:(a.order||0)-(b.order||0); }).map(renderTaskCard).join('');
  }
  if(dates.length===0 && overdue.length===0){ container.innerHTML = '<div class="empty">No hay tareas próximas.</div>'; return; }
  dates.forEach(d=>{
    const dayTasks = byDate[d].sort((a,b)=>{ const d2=(prioOrder[a.priority]??3)-(prioOrder[b.priority]??3); return d2!==0?d2:(a.order||0)-(b.order||0); });
    const dObj = new Date(d+'T00:00:00');
    const label = d===t0 ? `Hoy · ${dObj.getDate()}/${dObj.getMonth()+1}` : `${weekdayNames[dObj.getDay()]} ${dObj.getDate()}/${dObj.getMonth()+1}`;
    html += `<div class="task-group-label">${label}</div>`;
    html += dayTasks.map(renderTaskCard).join('');
  });
  container.innerHTML = html;
}

/* =====================================================================
   RENDER: PRÓXIMOS
   ===================================================================== */
function renderUpcoming(container){
  const t0 = todayISO();
  const tasks = state.tasks.filter(t=>!t.done && t.dueDate && t.dueDate > t0);
  if(tasks.length===0){ container.innerHTML = '<div class="empty">No hay tareas con fecha próxima.</div>'; return; }
  const byDate = {};
  tasks.forEach(t=>{ (byDate[t.dueDate] = byDate[t.dueDate]||[]).push(t); });
  const dates = Object.keys(byDate).sort();
  const prioOrder = {alta:0, media:1, baja:2, null:3, undefined:3};
  const weekdayNames = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  let html = '';
  dates.forEach(d=>{
    const dayTasks = byDate[d].sort((a,b)=>{ const d2=(prioOrder[a.priority]??3)-(prioOrder[b.priority]??3); return d2!==0?d2:(a.order||0)-(b.order||0); });
    const dObj = new Date(d+'T00:00:00');
    html += `<div class="task-group-label">${weekdayNames[dObj.getDay()]} ${dObj.getDate()}/${dObj.getMonth()+1}</div>`;
    html += dayTasks.map(renderTaskCard).join('');
  });
  container.innerHTML = html;
}

/* =====================================================================
   RENDER PRINCIPAL
   ===================================================================== */
function render(){
  renderAccountIndicator();
  renderSidebar();
  renderDayProgress();
  renderOrganizeButton();
  renderBulkBar();
  if(suggestionsOpen) renderSuggestions();
  const v = state.currentView;
  const titleEl = document.getElementById('main-title');
  const subEl = document.getElementById('main-sub');
  const addWrap = document.getElementById('add-task-wrap');
  const body = document.getElementById('view-body');
  const counterEl = document.getElementById('pending-counter');

  const pendingTotal = state.tasks.filter(t=>!t.done).length;
  counterEl.innerText = `${pendingTotal} tarea${pendingTotal===1?'':'s'} pendiente${pendingTotal===1?'':'s'} en total`;

  const specialViews = {
    stats: ()=>{ titleEl.innerText='Estadísticas'; subEl.innerText='Tu actividad y productividad'; addWrap.style.display='none'; renderStats(body); },
    calendar: ()=>{ titleEl.innerText='Calendario'; subEl.innerText='Arrastrá una tarea a otro día para reprogramarla'; addWrap.style.display='none'; renderCalendar(body); },
    week: ()=>{ titleEl.innerText='Semana'; subEl.innerText='Tus tareas de la semana'; addWrap.style.display='none'; renderWeek(body); },
    kanban: ()=>{ titleEl.innerText='Kanban'; subEl.innerText='Arrastrá tarjetas entre columnas para cambiar la prioridad'; addWrap.style.display='none'; renderKanban(body); },
    agenda: ()=>{ titleEl.innerText='Agenda'; subEl.innerText='Vencidas y próximas, agrupadas por día'; addWrap.style.display='none'; renderAgenda(body); },
    upcoming: ()=>{ titleEl.innerText='Próximos'; subEl.innerText='Tareas con fecha, agrupadas por día'; addWrap.style.display='none'; renderUpcoming(body); }
  };
  if(specialViews[v.type]){ specialViews[v.type](); return; }

  addWrap.style.display='block';
  if(v.type==='today'){ titleEl.innerText='Mi día'; subEl.innerText='Tareas de hoy y vencidas'; }
  else if(v.type==='important'){ titleEl.innerText='Importantes'; subEl.innerText='Tareas con prioridad alta'; }
  else if(v.type==='tomorrow'){ titleEl.innerText='Mañana'; subEl.innerText='Tareas programadas para mañana'; }
  else if(v.type==='filter'){ const f = QUICK_FILTERS.find(f=>f.id===v.id); titleEl.innerText = f ? f.label : ''; subEl.innerText=''; }
  else { const l = state.lists.find(l=>l.id===v.id); titleEl.innerText = l ? l.name : ''; subEl.innerText=''; }

  const tasks = getVisibleTasks();
  let pending = tasks.filter(t=>!t.done);
  const done = tasks.filter(t=>t.done);

  if(v.type==='list'){ pending.sort((a,b)=> (a.order||0) - (b.order||0)); }
  else {
    const prioOrder = {alta:0, media:1, baja:2, null:3, undefined:3};
    pending.sort((a,b)=> {
      const diff = (prioOrder[a.priority]??3) - (prioOrder[b.priority]??3);
      return diff !== 0 ? diff : (a.order||0) - (b.order||0);
    });
  }

  let html = '';
  if(pending.length===0 && done.length===0){
    html = '<div class="empty">No hay tareas todavía. Agregá una arriba.</div>';
  } else {
    if(pending.length) html += pending.map(renderTaskCard).join('');
    if(done.length && !state.hideCompleted){
      html += `<div class="task-group-label" style="cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="toggleHideCompleted()"><span style="display:inline-block;transition:transform .15s;">⌄</span> Completadas (${done.length})</div>`;
      html += done.map(renderTaskCard).join('');
    } else if(done.length && state.hideCompleted){
      html += `<div class="task-group-label" style="cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="toggleHideCompleted()"><span style="display:inline-block;transform:rotate(-90deg);transition:transform .15s;">⌄</span> Completadas (${done.length})</div>`;
    }
  }
  body.innerHTML = html;
}
function toggleHideCompleted(){ state.hideCompleted = !state.hideCompleted; saveState(); render(); }

/* =====================================================================
   CELEBRACIÓN
   ===================================================================== */
function showCelebration(count){
  document.getElementById('celebration-container').innerHTML = `
    <div class="celebration-overlay" onclick="closeCelebration(event)">
      <div class="celebration-box">
        <div class="big">🎉</div>
        <div class="title">¡Van ${count} tareas completadas!</div>
        <div class="sub">Seguí así, vas muy bien.</div>
        <button onclick="closeCelebration(event)">Genial</button>
      </div>
    </div>`;
}
function closeCelebration(evt){ evt.stopPropagation(); document.getElementById('celebration-container').innerHTML=''; }

/* =====================================================================
   ATAJOS DE TECLADO
   ===================================================================== */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || tag==='select';
  if(e.key === 'Escape'){ closeModal(); closeSearchOverlay(); closeContextMenu(); return; }
  if(typing) return;
  if(e.key === '/'){ e.preventDefault(); openSearch(); }
  else if(e.key === 'n'){ e.preventDefault(); if(state.currentView.type==='list'){ document.getElementById('new-task-title').focus(); } }
  else if(e.key === 'f'){ e.preventDefault(); toggleFocusMode(); }
});

/** Punto de arranque: si hay login configurado (APPS_SCRIPT_URL) y no hay sesión activa, pide el mail primero. */
function initApp(){
  if(isSheetsConfigured()){
    const saved = getSavedEmail();
    if(saved){ currentUserEmail = saved; loadState(); }
    else { showLoginGate(); }
  } else {
    loadState();
  }
}
initApp();
</script>
