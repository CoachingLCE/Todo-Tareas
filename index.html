<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis tareas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b6bf0'/%3E%3Cpath d='M18 33 L28 43 L46 21' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --card-hover:#fafaf9; --border:#e8e7e3; --border-strong:#d6d4cd;
    --text:#22221f; --text-2:#6e6d67; --text-muted:#a3a199;
    --accent:#3b6bf0; --accent-bg:#eaf0ff; --accent-strong:#2954c7;
    --high:#e0453c; --high-bg:#fdeceb;
    --med:#dd9012; --med-bg:#fdf3e3;
    --low:#3b6bf0; --low-bg:#eaf0ff;
    --success:#2f9e5b; --success-bg:#e7f6ee;
    --radius-sm:8px; --radius:12px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,20,15,.04);
    --shadow-md:0 2px 10px rgba(20,20,15,.06);
    --shadow-lg:0 10px 30px rgba(20,20,15,.12);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  [data-theme="dark"]{
    --bg:#15151a; --card:#1e1e24; --card-hover:#24242b; --border:#2d2d35; --border-strong:#3e3e48;
    --text:#eeeef2; --text-2:#a3a2ac; --text-muted:#6c6b76;
    --accent:#6f93f7; --accent-bg:#1c2846; --accent-strong:#8caaff;
    --high:#f0716a; --high-bg:#3a2020;
    --med:#f0ab4d; --med-bg:#3a2c14;
    --low:#6f93f7; --low-bg:#1c2846;
    --success:#4fbf82; --success-bg:#123322;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 2px 10px rgba(0,0,0,.35);
    --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg);color:var(--text);transition:background .25s var(--ease),color .25s var(--ease);
    -webkit-font-smoothing:antialiased;}
  .app{display:flex;height:100vh;}
  .app.focus-mode .sidebar,.app.focus-mode .suggestions-panel{display:none;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:246px;background:var(--card);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;overflow-y:auto;}
  .sidebar-brand{display:flex;justify-content:space-between;align-items:center;margin:2px 8px 16px;gap:6px;}
  .sidebar-brand h1{font-size:15.5px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .theme-toggle{background:none;border:none;border-radius:var(--radius-sm);width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--text-2);transition:background .15s;}
  .theme-toggle:hover{background:var(--bg);}
  .search-btn{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:13px;cursor:pointer;background:var(--bg);transition:border-color .15s;}
  .search-btn:hover{border-color:var(--border-strong);}
  .search-btn .kbd{margin-left:auto;font-size:11px;opacity:.6;border:1px solid var(--border);border-radius:4px;padding:0 4px;}

  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;color:var(--text-2);margin-bottom:1px;transition:background .12s;}
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-bg);color:var(--accent-strong);font-weight:600;}
  .nav-item .nav-icon{width:16px;text-align:center;font-size:13px;opacity:.9;}
  .nav-item .count{margin-left:auto;font-size:11.5px;color:var(--text-muted);}
  .nav-item.active .count{color:var(--accent-strong);}

  .section-toggle{display:flex;align-items:center;justify-content:space-between;font-size:11px;text-transform:uppercase;color:var(--text-muted);margin:18px 6px 6px;letter-spacing:.05em;cursor:pointer;user-select:none;}
  .section-toggle .chev{transition:transform .15s;}
  .section-toggle.collapsed .chev{transform:rotate(-90deg);}
  .section-body.collapsed{display:none;}
  /* (se quitó el scroll propio de #lists — el usuario prefiere que scrollee todo el sidebar junto) */

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;color:var(--text-2);transition:background .12s;}
  .list-row:hover{background:var(--bg);}
  .list-row.active{background:var(--accent-bg);color:var(--accent-strong);font-weight:600;}
  .list-row .dot{width:7px;height:7px;border-radius:50%;margin-right:0;display:inline-block;flex-shrink:0;}
  .list-row-empty{opacity:.5;}
  .list-row-empty:hover{opacity:.8;}
  .list-row.dragging{opacity:.4;}
  .list-row.drag-over{box-shadow:inset 0 2px 0 var(--accent);}
  .list-row-inner{display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .add-list{display:flex;gap:6px;padding:6px 2px;margin-top:10px;margin-bottom:6px;}
  .add-list input{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 9px;font-size:13px;background:var(--card);color:var(--text);}
  .add-list button{border:none;background:var(--accent);color:#fff;border-radius:var(--radius-sm);padding:6px 11px;font-size:13px;cursor:pointer;}
  .del-list-btn{opacity:0;font-size:12px;color:var(--text-muted);cursor:pointer;padding:2px 4px;}
  .list-row:hover .del-list-btn{opacity:1;}
  .import-btn{margin-top:10px;}
  .sidebar-footer{margin-top:auto;padding:14px 10px 4px;font-size:11px;color:var(--text-muted);text-align:center;}

  /* ---------- Main ---------- */
  .main{flex:1;overflow-y:auto;padding:0 40px 40px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
  .main::-webkit-scrollbar{width:8px;}
  .main::-webkit-scrollbar-track{background:transparent;}
  .main::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
  .main::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}
  .sidebar{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-track{background:transparent;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px;}
  .top-header{position:sticky;top:0;background:var(--bg);padding:26px 0 18px;z-index:5;}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .main-header{font-size:24px;font-weight:600;margin-bottom:3px;letter-spacing:-.015em;}
  .main-sub{font-size:13px;color:var(--text-muted);}
  .header-actions{display:flex;gap:8px;flex-shrink:0;}
  .hbtn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:34px;font-size:14px;cursor:pointer;color:var(--text-2);transition:border-color .15s,background .15s;}
  .hbtn:hover{border-color:var(--border-strong);background:var(--card-hover);}
  .hbtn.on{background:var(--accent-bg);color:var(--accent-strong);border-color:var(--accent);}

  .day-progress-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow-sm);
    transition:padding .28s var(--ease),margin .28s var(--ease);}
  .dpc-greeting{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px;transform-origin:top left;transition:transform .28s var(--ease);}
  .dpc-hero{display:flex;gap:28px;margin-bottom:14px;flex-wrap:wrap;transition:gap .28s var(--ease),margin .28s var(--ease);}
  .dpc-hero-item .num{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1;transition:font-size .28s var(--ease);}
  .dpc-hero-item .label{font-size:12.5px;color:var(--text-muted);margin-top:5px;transition:font-size .28s var(--ease);}
  .dpc-progress-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .dpc-progress-wrap{flex:1;background:var(--bg);border-radius:20px;height:10px;overflow:hidden;}
  .dpc-progress-bar{height:100%;background:var(--accent);border-radius:20px;transition:width .4s var(--ease);}
  .dpc-progress-pct{font-size:13px;font-weight:600;color:var(--accent-strong);min-width:36px;text-align:right;}
  .dpc-msg{font-size:13.5px;color:var(--text-2);}
  .dpc-collapsible{max-height:400px;opacity:1;transform:translateY(0);overflow:hidden;
    transition:max-height .28s var(--ease),opacity .22s var(--ease),margin .28s var(--ease),transform .28s var(--ease);}

  /* Header compacto (sticky al scrollear): quedan solo las métricas (más chicas) + el botón */
  .day-progress-card.compact{padding-top:8px;padding-bottom:8px;}
  .day-progress-card.compact .dpc-greeting{transform:scale(.92);}
  .day-progress-card.compact .dpc-collapsible{max-height:0;opacity:0;margin:0;transform:translateY(-6px);pointer-events:none;}
  .day-progress-card.compact .dpc-hero{gap:20px;margin-bottom:0;}
  .day-progress-card.compact .dpc-hero-item .num{font-size:17px;}
  .day-progress-card.compact .dpc-hero-item .label{font-size:9.5px;}
  .organize-cta-wrap{text-align:center;margin:16px 0;transition:margin .2s var(--ease);}
  .organize-btn-pill{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));
    color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,padding .2s var(--ease),font-size .2s var(--ease);}
  .organize-btn-pill:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .organize-btn-pill:active{transform:translateY(0);}
  .organize-cta-sub{font-size:11.5px;color:var(--text-muted);margin-top:6px;transition:opacity .2s,max-height .2s;}
  .organize-cta-wrap.compact{margin:8px 0;}
  .organize-cta-wrap.compact .organize-btn-pill{padding:6px 14px;font-size:11.5px;}
  .organize-cta-wrap.compact .organize-cta-sub{opacity:0;max-height:0;overflow:hidden;margin:0;}
  .organize-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#fff;border:none;
    border-radius:var(--radius-lg);padding:15px 20px;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;
    align-items:center;gap:10px;justify-content:center;margin:14px 0;box-shadow:var(--shadow-md);
    transition:padding .28s var(--ease),font-size .28s var(--ease),margin .28s var(--ease),box-shadow .15s;}
  .organize-btn:hover{box-shadow:var(--shadow-lg);}
  .organize-btn.compact{padding:8px 16px;font-size:12.5px;margin:8px 0 4px;gap:7px;}
  .organize-suggestion-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .organize-suggestion-row:last-child{border-bottom:none;}

  .add-task-wrap{margin:22px 0 14px;}
  .add-task{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;flex-wrap:wrap;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;}
  .add-task:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
  .add-task input[type=text]{flex:1;min-width:180px;border:none;outline:none;font-size:14.5px;background:transparent;color:var(--text);}
  .prio-select{display:flex;gap:5px;}
  .mobile-prio-toggle, .mobile-prio-menu{display:none;}
  .prio-btn{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);cursor:pointer;background:transparent;transition:transform .12s;}
  .prio-btn:hover{transform:scale(1.12);}
  .prio-btn.high{border-color:var(--high);} .prio-btn.high.sel{background:var(--high);}
  .prio-btn.med{border-color:var(--med);} .prio-btn.med.sel{background:var(--med);}
  .prio-btn.low{border-color:var(--low);} .prio-btn.low.sel{background:var(--low);}
  .add-task input[type=date]{border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font-size:12px;color:var(--text-2);background:var(--bg);}
  .add-task-submit{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
  .add-task-submit:hover{background:var(--accent-strong);}
  .smart-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding:0 2px;}
  .smart-chip{font-size:11.5px;padding:4px 11px;border-radius:20px;background:var(--accent-bg);color:var(--accent-strong);font-weight:600;display:flex;align-items:center;gap:5px;animation:chipIn .18s var(--ease);}
  @keyframes chipIn{from{opacity:0;transform:translateY(-3px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
  .similar-warning{font-size:12px;color:var(--med);margin-top:8px;padding:8px 12px;background:var(--med-bg);border-radius:var(--radius-sm);}

  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .filter-chip{font-size:12px;padding:5px 13px;border-radius:20px;border:1px solid var(--border);color:var(--text-2);cursor:pointer;background:var(--card);transition:border-color .15s;}
  .filter-chip:hover{border-color:var(--border-strong);}
  .filter-chip.active{background:var(--accent-bg);color:var(--accent-strong);border-color:var(--accent);font-weight:600;}

  .view-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .view-toolbar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .toggle-pill{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-2);cursor:pointer;}
  .toggle-pill.on{background:var(--accent-bg);color:var(--accent-strong);border-color:var(--accent);}

  /* ---------- Task cards ---------- */
  .task-group-label{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px;}
  .task{position:relative;background:var(--card);border:1px solid var(--border);border-left:3px solid transparent;border-radius:var(--radius);padding:13px 14px;margin-bottom:8px;
    transition:opacity .25s var(--ease),transform .25s var(--ease),box-shadow .15s,border-color .15s;box-shadow:var(--shadow-sm);}
  .task:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);}
  .task.prio-alta{border-left-color:var(--high);}
  .task.is-favorite{background:var(--accent-bg);}
  body.density-compact .task{padding:9px 12px;margin-bottom:6px;}
  body.density-compact .task-meta{margin-top:3px;gap:5px;}
  body.density-comfortable .task{padding:18px 20px;margin-bottom:12px;}
  body.density-comfortable .task-meta{margin-top:9px;gap:9px;}
  body.font-small .task-title{font-size:13px;}
  body.font-small .badge,body.font-small .tag,body.font-small .date-badge{font-size:9px;}
  body.font-large .task-title{font-size:16.5px;}
  body.font-large .badge,body.font-large .tag,body.font-large .date-badge{font-size:11px;}
  .task.prio-media{border-left-color:var(--med);}
  .task.prio-baja{border-left-color:var(--low);}
  .task.done{opacity:.5;}
  .task.removing{opacity:0;transform:translateX(14px) scale(.98);}
  .task.completing{opacity:.35;transform:scale(.96);}
  @keyframes taskEnter{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .task.task-enter{animation:taskEnter .3s var(--ease);}
  .task.dragging{opacity:.35;}
  .task.drag-over-task{border-top:2px solid var(--accent);}
  .task.selected{box-shadow:0 0 0 2px var(--accent);}
  .task-row{display:flex;align-items:flex-start;gap:11px;}
  .checkbox{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--card);transition:background .18s var(--ease),border-color .18s,transform .18s var(--ease);}
  .checkbox:hover{border-color:var(--accent);}
  .checkbox.checked{background:var(--success);border-color:var(--success);color:#fff;font-size:11px;transform:scale(1.06);}
  .select-box{width:16px;height:16px;border-radius:5px;border:2px solid var(--border-strong);cursor:pointer;margin-top:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
  .select-box.checked{background:var(--accent);border-color:var(--accent);}
  .task-body{flex:1;min-width:0;}
  .youtube-card{margin-bottom:9px;}
  .youtube-thumb{width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius-sm);display:block;background:var(--bg);}
  .youtube-thumb-loading{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-muted);}
  .youtube-card-meta{display:flex;gap:6px;margin-top:6px;}
  .youtube-watch-btn{display:inline-block;margin-top:7px;font-size:12px;font-weight:600;color:var(--accent-strong);text-decoration:none;}
  .youtube-watch-btn:hover{text-decoration:underline;}
  .task-title{font-size:14.5px;font-weight:600;cursor:pointer;line-height:1.35;letter-spacing:-.005em;}
  .task-title:hover{color:var(--accent-strong);}
  .task.done .task-title{text-decoration:line-through;color:var(--text-muted);}
  .task-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;align-items:center;}
  .badge{font-size:9.5px;padding:2.5px 8px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .badge.high{background:var(--high-bg);color:var(--high);}
  .badge.med{background:var(--med-bg);color:var(--med);}
  .badge.low{background:var(--low-bg);color:var(--low);}
  .tag{font-size:9.5px;padding:2.5px 8px;border-radius:20px;background:var(--bg);color:var(--text-2);border:1px solid var(--border);}
  .date-badge{font-size:9.5px;color:var(--text-muted);padding:2.5px 8px;border-radius:20px;background:var(--bg);display:inline-flex;align-items:center;gap:3px;}
  .date-badge.today{color:var(--accent-strong);background:var(--accent-bg);font-weight:600;}
  .date-badge.overdue{color:var(--high);background:var(--high-bg);font-weight:600;}
  .recur-badge{font-size:11px;color:var(--text-muted);}
  .task-actions{position:absolute;top:10px;right:10px;display:flex;gap:2px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s;}
  .task:hover .task-actions,.task-actions.force-visible{opacity:1;visibility:visible;pointer-events:auto;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:4px 6px;border-radius:6px;transition:background .12s,color .12s;}
  .desktop-only-action{display:none;}
  .kebab-btn{display:flex;align-items:center;justify-content:center;min-width:26px;min-height:26px;font-size:17px;
    background:transparent;border:none;border-radius:6px;color:#9ca3af;transition:color .2s,background .2s;}
  .kebab-btn:hover{color:#fff;background:rgba(255,255,255,.08);}
  [data-theme="light"] .kebab-btn:hover{color:var(--text);background:rgba(0,0,0,.06);}
  .icon-btn:hover{color:var(--text);background:var(--bg);}
  .progress-bar-wrap{background:var(--bg);border-radius:20px;height:4px;overflow:hidden;margin-top:6px;width:100%;max-width:180px;}
  .progress-bar{height:100%;background:var(--accent);border-radius:20px;transition:width .25s var(--ease);}

  .subtasks{margin:11px 0 2px 31px;}
  .subtask-row{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:13px;}
  .subtask-row .checkbox{width:16px;height:16px;}
  .subtask-row.done span{text-decoration:line-through;color:var(--text-muted);}
  .add-sub{display:flex;gap:6px;margin-top:7px;}
  .add-sub input{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;background:var(--card);color:var(--text);}
  .add-sub button{border:none;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;cursor:pointer;}

  .add-tag-row{display:flex;gap:6px;margin-top:7px;}
  .add-tag-row input{border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 9px;font-size:12px;width:120px;background:var(--card);color:var(--text);}
  .add-tag-row button{border:none;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 9px;font-size:12px;cursor:pointer;}

  .empty{color:var(--text-muted);font-size:13px;padding:24px 0;text-align:center;}
  .expand-btn{background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;padding:0;margin-top:5px;}

  /* ---------- Bulk selection bar ---------- */
  .bulk-bar{position:sticky;top:0;z-index:6;background:var(--text);color:var(--bg);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;box-shadow:var(--shadow-lg);}
  .bulk-bar .bulk-actions{display:flex;gap:8px;}
  .bulk-bar button{background:rgba(255,255,255,.12);border:none;color:inherit;border-radius:var(--radius-sm);padding:6px 12px;font-size:12.5px;cursor:pointer;}
  [data-theme="dark"] .bulk-bar button{background:rgba(0,0,0,.25);}

  /* ---------- Context menu ---------- */
  .context-menu{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;z-index:1200;min-width:170px;}
  .context-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;font-size:13px;color:var(--text);border-radius:var(--radius-sm);cursor:pointer;}
  .context-menu button:hover{background:var(--bg);}
  .context-menu .danger{color:var(--high);}
  .context-menu hr{border:none;border-top:1px solid var(--border);margin:4px 0;}

  /* ---------- Stats ---------- */
  .stats-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);}
  .stat-card .num{font-size:23px;font-weight:600;letter-spacing:-.01em;}
  .stat-card .label{font-size:12px;color:var(--text-muted);margin-top:3px;}
  .stats-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;font-size:13px;}
  .stats-row .bar-wrap{flex:1;margin:0 14px;background:var(--bg);border-radius:20px;height:8px;overflow:hidden;}
  .stats-row .bar{height:100%;background:var(--accent);border-radius:20px;}
  .stats-row .day-count{font-weight:600;min-width:20px;text-align:right;}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .chart-card canvas{max-height:220px;}
  .stats-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .reading-goal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .reading-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
  .reading-title{flex:1;font-size:13.5px;font-weight:500;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .reading-pct{font-size:12px;color:var(--text-muted);font-weight:600;min-width:32px;text-align:right;}
  .stats-hero-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center;box-shadow:var(--shadow-sm);}
  .stats-hero-card .hero-icon{color:var(--accent);margin-bottom:8px;}
  .stats-hero-card .hero-num{font-size:25px;font-weight:700;letter-spacing:-.01em;}
  .stats-hero-card .hero-label{font-size:12px;color:var(--text-muted);margin-top:5px;}

  /* ---------- Overlays / modals ---------- */
  .celebration-overlay,.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,15,10,.45);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(1px);}
  .celebration-box{background:var(--card);border-radius:var(--radius-lg);padding:30px 34px;text-align:center;max-width:280px;box-shadow:var(--shadow-lg);}
  .celebration-box .big{font-size:34px;margin-bottom:8px;}
  .celebration-box .title{font-size:16px;font-weight:600;margin-bottom:4px;}
  .celebration-box .sub{font-size:13px;color:var(--text-muted);margin-bottom:18px;}
  .celebration-box button{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px 22px;font-size:13px;font-weight:600;cursor:pointer;}

  .modal-box{background:var(--card);border-radius:var(--radius-lg);padding:26px;width:460px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .modal-box h2{font-size:17.5px;font-weight:600;margin:0 0 18px;letter-spacing:-.01em;}
  .field-label{font-size:11.5px;color:var(--text-muted);margin:13px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .modal-box input[type=text],.modal-box textarea,.modal-box select,.modal-box input[type=date],.modal-box input[type=number]{
    width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;background:var(--bg);color:var(--text);font-family:inherit;
  }
  .modal-box textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:22px;gap:8px;}
  .modal-actions .right{display:flex;gap:8px;}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:var(--radius-sm);padding:9px 17px;font-size:13px;cursor:pointer;transition:border-color .15s;}
  .btn:hover{border-color:var(--border-strong);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn.primary:hover{background:var(--accent-strong);}
  .btn.danger{color:var(--high);border-color:var(--high-bg);}
  .modal-row2{display:flex;gap:10px;}
  .modal-row2>div{flex:1;}
  .recur-extra{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .reminder-item{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;}
  .ai-panel{margin-top:14px;padding:14px;border:1px dashed var(--border-strong);border-radius:var(--radius);}
  .ai-actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .ai-actions-grid button{font-size:12px;padding:7px 8px;}
  .ai-result-box{margin-top:10px;font-size:13px;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;}
  .ai-sub-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;}

  .search-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,15,10,.4);display:flex;justify-content:center;padding-top:80px;z-index:999;}
  .search-box{background:var(--card);border-radius:var(--radius-lg);width:540px;max-width:92vw;max-height:70vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:18px;}
  .search-box input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;background:var(--bg);color:var(--text);margin-bottom:12px;}
  .search-result{padding:11px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;margin-bottom:2px;}
  .search-result:hover{background:var(--bg);}
  .search-result .r-title{font-weight:500;}
  .search-result .r-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .search-result .r-meta-rich{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:11.5px;color:var(--text-muted);margin-top:6px;}
  .search-result mark{background:var(--accent-bg);color:var(--accent-strong);border-radius:3px;padding:0 2px;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:11px 20px;border-radius:var(--radius-sm);font-size:13px;display:flex;align-items:center;gap:16px;z-index:998;box-shadow:var(--shadow-lg);animation:toastIn .18s var(--ease);}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  .toast button{background:none;border:none;color:var(--accent-strong);font-weight:600;cursor:pointer;font-size:13px;}

  .suggestions-panel{width:280px;background:var(--card);border-left:1px solid var(--border);padding:22px;overflow-y:auto;display:none;}
  .suggestions-panel.open{display:block;}
  .suggestions-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .suggestions-header h2{font-size:17px;font-weight:600;margin:0;}
  .suggestion-group-label{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px;}
  .suggestion-group-label:first-child{margin-top:0;}
  .suggestion-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
  .suggestion-row .s-title{font-size:13px;}
  .suggestion-row .s-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .suggestion-add{background:none;border:none;color:var(--accent);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;}

  /* ---------- Calendar / Week ---------- */
  .calendar-grid,.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .cal-nav button{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;}
  .cal-weekday{font-size:11px;color:var(--text-muted);text-align:center;padding:4px 0;text-transform:uppercase;font-weight:600;}
  .cal-day{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);min-height:92px;padding:7px;font-size:12px;transition:background .12s;}
  .cal-day.other-month{opacity:.4;}
  .cal-day.today{border-color:var(--accent);border-width:2px;}
  .cal-day.drag-over{background:var(--accent-bg);}
  .cal-day .cal-day-num{font-weight:600;margin-bottom:5px;}
  .cal-task-chip{font-size:10.5px;padding:3px 7px;border-radius:6px;background:var(--accent-bg);color:var(--accent-strong);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;}
  .cal-task-chip.high{background:var(--high-bg);color:var(--high);}
  .cal-task-chip.med{background:var(--med-bg);color:var(--med);}
  .cal-task-chip.done{opacity:.4;text-decoration:line-through;}
  .cal-task-chip.overdue{outline:1px solid var(--high);}
  .week-day{min-height:340px;}

  /* ---------- Kanban ---------- */
  .kanban-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
  .kanban-col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:200px;}
  .kanban-col.drag-over{background:var(--accent-bg);}
  .kanban-col-header{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;margin-bottom:10px;padding:0 2px;}
  .kanban-col-header .dot{width:8px;height:8px;border-radius:50%;}
  .kanban-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:8px;font-size:12.5px;cursor:grab;}
  .kanban-card.done{opacity:.5;text-decoration:line-through;}

  /* ---------- Agenda ---------- */
  .agenda-day{margin-bottom:6px;}

  .pending-counter{font-size:12px;color:var(--text-muted);margin-bottom:8px;}
  .reminder-banner{background:var(--med-bg);color:var(--med);border-radius:var(--radius-sm);padding:11px 15px;font-size:13px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
  .reminder-banner button{background:none;border:none;color:var(--med);cursor:pointer;font-weight:600;}

  /* ---------- Pomodoro / Focus ---------- */
  .pomodoro-panel{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;box-shadow:var(--shadow-lg);z-index:900;text-align:center;min-width:180px;}
  .pomodoro-time{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px;}
  .pomodoro-mode{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
  .pomodoro-actions{display:flex;gap:6px;justify-content:center;}

  /* ---------- Login ---------- */
  .login-overlay{position:fixed;inset:0;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;z-index:999;}
  [data-theme="dark"] .login-overlay{background:rgba(10,10,14,.55);}
  .login-box{background:var(--card);border-radius:var(--radius-lg);padding:36px 32px;width:360px;max-width:90vw;
    box-shadow:var(--shadow-lg);animation:loginIn .25s var(--ease);}
  @keyframes loginIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .login-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));
    color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:var(--shadow-md);}
  .login-title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;}
  .login-subtitle{font-size:15px;color:var(--text-muted);margin-bottom:28px;}
  .login-label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .login-input{width:100%;height:50px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;
    font-size:16px;background:var(--bg);color:var(--text);transition:border-color .15s,box-shadow .15s;}
  .login-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
  .login-input.invalid{border-color:var(--high);}
  .login-error{font-size:12.5px;color:var(--high);margin-top:8px;min-height:16px;}
  .login-btn{width:100%;height:50px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
    font-size:16px;font-weight:600;margin-top:20px;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:background .15s,transform .1s,box-shadow .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .login-btn:hover{background:var(--accent-strong);box-shadow:var(--shadow-md);}
  .login-btn:active{transform:scale(.98);}
  .login-btn:disabled{opacity:.75;cursor:default;}
  .login-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* ---------- Mobile ---------- */
  .mobile-menu-btn{display:none;}
  .sidebar-backdrop{display:none;}
  @media (max-width: 768px){
    .mobile-menu-btn{display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius-sm);width:44px;height:44px;cursor:pointer;color:var(--text-2);flex-shrink:0;}
    .sidebar{position:fixed;top:0;left:-280px;bottom:0;width:260px;z-index:60;transition:left .25s var(--ease);box-shadow:var(--shadow-lg);}
    .sidebar.mobile-open{left:0;}
    .sidebar-backdrop.mobile-open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;}
    .main{padding:0 10px 90px;}
    .top-header{padding:14px 0 10px;}
    .header-row{gap:8px;}
    .main-header{font-size:17px;margin-bottom:0;}
    .main-sub{display:none;}
    .header-actions{gap:6px;}
    .hbtn{width:44px;height:44px;}
    .day-progress-card{padding:12px 14px;}
    .dpc-greeting{font-size:15px;margin-bottom:8px;}
    .dpc-hero{gap:14px;margin-bottom:10px;}
    .dpc-hero-item .num{font-size:19px;}
    .dpc-hero-item .label{font-size:10px;}
    .organize-btn{padding:12px 16px;font-size:13.5px;}

    /* Cards de tareas mucho más compactas */
    .task{padding:9px 12px;}
    .task-title{font-size:13.5px;font-weight:500;}
    .task-meta{gap:5px;margin-top:5px;}
    .badge, .tag, .date-badge{font-size:10px;padding:2px 7px;}
    .checkbox{width:22px;height:22px;}
    .task-actions .icon-btn{min-width:38px;min-height:38px;display:flex;align-items:center;justify-content:center;}
    .progress-bar-wrap{margin-top:5px;}
    .task-group-label{margin:12px 0 6px;}

    .stats-summary{grid-template-columns:repeat(2,1fr);}
    .stats-hero{grid-template-columns:1fr;gap:8px;}
    .kanban-grid{grid-template-columns:1fr;}
    .calendar-grid, .week-grid{gap:3px;}
    .cal-day{min-height:56px;padding:4px;font-size:10px;}
    .cal-day-num{font-size:10.5px;}
    .cal-task-chip{font-size:9.5px;padding:2px 5px;}
    .modal-box{width:94vw;padding:20px;max-height:88vh;}
    .search-overlay{padding-top:0;align-items:stretch;}
    .search-box{width:100%;max-width:100%;height:100%;border-radius:0;padding:14px;}
    .suggestions-panel{position:fixed;right:0;top:0;bottom:0;width:82vw;max-width:300px;z-index:60;}
    .pomodoro-panel{right:12px;bottom:96px;left:12px;width:auto;}
    .login-box{width:92vw;padding:28px 22px;}
    .login-title{font-size:26px;}
    .login-subtitle{font-size:14px;margin-bottom:22px;}
    .login-input{height:52px;font-size:16px;}
    .login-btn{height:52px;font-size:16px;}

    /* Barra fija de "Agregar tarea" abajo, con selector de prioridad y fecha compactos */
    .add-task-wrap{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:45;background:var(--card);
      border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -3px 14px rgba(0,0,0,.08);}
    .add-task{border-radius:26px;padding:6px 6px 6px 16px;box-shadow:none;}
    .add-task input[type=text]{width:auto;min-width:0;order:0;}
    .prio-select{order:1;position:relative;}
    #new-prio .prio-btn{display:none;}
    .mobile-prio-toggle{display:flex;width:32px;height:32px;border-radius:50%;border:2px solid var(--border-strong);
      background:transparent;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;}
    .mobile-prio-toggle .dot{width:10px;height:10px;border-radius:50%;}
    .mobile-prio-menu{position:absolute;bottom:44px;right:0;background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;min-width:120px;z-index:50;}
    .mobile-prio-menu button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:8px 10px;
      font-size:13px;color:var(--text);border-radius:var(--radius-sm);cursor:pointer;}
    .mobile-prio-menu button:hover{background:var(--bg);}
    .mobile-prio-menu .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
    .add-task input[type=date]{order:2;width:34px;padding:0;background:transparent;border:none;flex-shrink:0;color-scheme:light dark;}
    [data-theme="dark"] .add-task input[type=date]{filter:invert(1);}
    .add-task-submit{order:3;width:40px;height:40px;border-radius:50%;padding:0;font-size:22px;line-height:1;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .smart-chips{position:fixed;left:10px;right:10px;bottom:66px;z-index:44;}

    /* Swipe sobre tareas: derecha completa; izquierda abre el menú de acciones (⋮) */
    .task-swipe-wrapper{position:relative;overflow:hidden;border-radius:var(--radius);margin-bottom:9px;}
    .task-swipe-wrapper .task{margin-bottom:0;}
    .task-swipe-wrapper.swipe-right-active .task{background:var(--success-bg);}

    /* Menú de acciones: solo kebab visible, botones sueltos ocultos */
    .desktop-only-action{display:none;}
    .kebab-btn{display:flex;min-width:38px;min-height:38px;align-items:center;justify-content:center;font-size:18px;}
    .task-actions{opacity:1;visibility:visible;pointer-events:auto;top:6px;right:6px;}

    /* Modales como Bottom Sheet (desde abajo, como Android/iOS) */
    .modal-overlay{align-items:flex-end;}
    .modal-box{width:100%;max-width:100%;border-radius:18px 18px 0 0;margin:0;max-height:88vh;
      animation:sheetUp .25s var(--ease);padding-bottom:calc(20px + env(safe-area-inset-bottom));}
    @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  }
  .action-sheet-handle{width:36px;height:4px;background:var(--border-strong);border-radius:4px;margin:0 auto 16px;}
  .action-sheet-title{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:12px;text-align:center;}
  .action-sheet-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:13px 8px;
    font-size:15px;color:var(--text);border-bottom:1px solid var(--border);cursor:pointer;text-align:left;}
  .action-sheet-btn:last-of-type{border-bottom:none;}
  .action-sheet-btn.danger{color:var(--high);}
  .mobile-only-nav{display:none;}
  .mobile-stats-strip{display:none;}
  .nav-more-collapsible{display:none;}
  .nav-more-collapsible.expanded{display:block;}
  #nav-more-toggle{color:var(--text-muted);}
  #nav-more-toggle .nav-more-chevron{transition:transform .15s;}
  #nav-more-toggle.expanded .nav-more-chevron{transform:rotate(180deg);}
  @media (max-width: 768px){
    .mobile-only-nav{display:flex;}
    .mobile-stats-strip{display:flex;gap:14px;justify-content:center;padding-bottom:6px;font-size:11.5px;color:var(--text-muted);}

<script>
/* =====================================================================

let state = { lists: [], tasks: [], currentView: {type:'list', id:null}, totalCompletedEver: 0, darkMode:false, hideCompleted:false };
let newPrio = null;

let calDate = new Date();

let lastDeleted = null;
let toastTimer = null;
let selectMode = false;
let selectedIds = new Set();
// (el plegado de secciones del sidebar ahora vive en state.collapsedSections, persistente)
let focusMode = false;
let justAddedTaskId = null;

const STORAGE_KEY = 'todo-app-state';
const APP_VERSION = '1.14.2';

/* =====================================================================
   ÍCONOS (SVG estilo Lucide, en vez de emojis, para una imagen más profesional)
   ===================================================================== */
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>',
  cloud: '<path d="M17.5 19H9a5 5 0 1 1 1.03-9.9A6 6 0 0 1 21 11.5 4.5 4.5 0 0 1 17.5 19Z"/>',

  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  calendarDays: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
  barChart: '<path d="M3 3v18h18M8 17V9M13 17V5M18 17v-7"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  clipboard: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M9 10h6M9 14h6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5" fill="currentColor"/>',
  lightbulb: '<path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.47c.53.48.9 1.13 1 1.83V16h6v-1.7c.1-.7.47-1.35 1-1.83A6 6 0 0 0 12 2Z"/>',
  helpCircle: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.7 1.2c0 1.5-2.2 1.8-2.2 3.3M12 17h.01"/>',
  checkSquare: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/>',
  sparkles: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  flame: '<path d="M12 22c4 0 7-2.5 7-6.5 0-3-2-5-3-7-.3 2-1.5 3-2.5 2 .5-2.5-.5-5-2.5-6.5.5 2.5-1 4-2.5 6-1.2 1.6-2.5 3-2.5 5.5C6 19.5 8 22 12 22Z"/>',
  trendUp: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
};
function icon(name, size){
  size = size || 16;
  const paths = ICONS[name] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;">${paths}</svg>`;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return toISO(new Date()); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

/* Storage: usa window.storage dentro de Claude; si no existe (archivo abierto
   suelto en el navegador), usa localStorage como respaldo. */
const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage !== null;

/* =====================================================================
   LOGIN POR MAIL + GOOGLE SHEETS (opcional)
   Mientras APPS_SCRIPT_URL no esté configurada, la app funciona exactamente
   igual que antes (sin pedir login, guardando solo en este navegador/Claude).
   Una vez configurada, cada mail guarda y trae sus propias tareas desde la
   planilla de Google, permitiendo usar la app desde distintos dispositivos.
   ===================================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnAY7ZTHKUc68A7oC1Tzfz2aXo0FgJ_bsMHyMJLFBaEJJCbslG5Bi4o2aFwaqUEljkbw/exec';
const EMAIL_STORAGE_KEY = 'mis-tareas-active-email';
let currentUserEmail = null;

function isSheetsConfigured(){ return !!APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('http') === 0; }
function getSavedEmail(){ try{ return localStorage.getItem(EMAIL_STORAGE_KEY); }catch(e){ return null; } }
function setSavedEmail(email){ try{ localStorage.setItem(EMAIL_STORAGE_KEY, email); }catch(e){} }
function clearSavedEmail(){ try{ localStorage.removeItem(EMAIL_STORAGE_KEY); }catch(e){} }

async function sheetsGet(email){
  const url = APPS_SCRIPT_URL + '?action=get&email=' + encodeURIComponent(email);
  const resp = await fetch(url);
  const data = await resp.json();
  return data.value || null;
}
async function sheetsSet(email, value){
  const resp = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'}, // evita el preflight CORS con Apps Script
    body: JSON.stringify({ action:'save', email, value })
  });
  const data = await resp.json();
  if(!data.success) throw new Error('La planilla no confirmó el guardado');
}

function showLoginGate(){
  document.getElementById('login-gate-container').innerHTML = `
    <div class="login-overlay">
      <div class="login-box">
        <div class="login-logo">${icon('checkSquare',26)}</div>
        <div class="login-title">Bienvenido</div>
        <div class="login-subtitle">Ingresá tu correo electrónico</div>
        <label class="login-label" for="login-email-input">Correo electrónico</label>
        <input type="email" id="login-email-input" class="login-input" placeholder="tu@mail.com"
          autocomplete="email" inputmode="email"
          oninput="onLoginEmailInput()" onkeydown="if(event.key==='Enter')submitLogin()">
        <div id="login-error" class="login-error"></div>
        <button class="login-btn" id="login-submit-btn" onclick="submitLogin()">Continuar</button>
      </div>
    </div>`;
  setTimeout(()=>{ const el = document.getElementById('login-email-input'); if(el) el.focus(); }, 30);
}
function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
function onLoginEmailInput(){
  const input = document.getElementById('login-email-input');
  const errEl = document.getElementById('login-error');
  const val = input.value.trim();
  if(val.length === 0 || isValidEmail(val)){ input.classList.remove('invalid'); errEl.innerText = ''; }
  else { input.classList.add('invalid'); errEl.innerText = 'Ingresá un mail válido.'; }
}
async function submitLogin(){
  const input = document.getElementById('login-email-input');
  const email = input.value.trim().toLowerCase();
  const btn = document.getElementById('login-submit-btn');
  if(!isValidEmail(email)){
    input.classList.add('invalid');
    document.getElementById('login-error').innerText = 'Ingresá un mail válido.';
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="login-spinner"></span>';
  setSavedEmail(email);
  currentUserEmail = email;
  await loadState();
  document.getElementById('login-gate-container').innerHTML = '';
}
function logoutUser(){
  if(!confirm(`¿Cerrar sesión de ${currentUserEmail}?`)) return;
  clearSavedEmail();
  location.reload();
}
function renderAccountIndicator(){
  const el = document.getElementById('account-indicator');
  if(!el) return;
  if(!currentUserEmail){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="search-btn" onclick="logoutUser()" title="Cerrar sesión" style="margin-bottom:12px;">
    👤 ${escapeHtml(currentUserEmail)} <span class="kbd" style="margin-left:auto;">Salir</span>
  </div>`;
}

async function storageGet(key){
  if(currentUserEmail && isSheetsConfigured()){
    const value = await sheetsGet(currentUserEmail);
    return value ? { key, value, shared:false } : null;
  }
  if(hasClaudeStorage) return await window.storage.get(key, false);
  const raw = localStorage.getItem(key);
  return raw !== null ? { key, value: raw, shared:false } : null;
}
async function storageSet(key, value){
  if(currentUserEmail && isSheetsConfigured()){
    await sheetsSet(currentUserEmail, value);
    return { key, value, shared:false };
  }
  if(hasClaudeStorage) return await window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return { key, value, shared:false };
}

/** Si hay un respaldo local guardado (por una falla previa del servidor), lo devuelve. */
function tryRecoverLocalBackup(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY + '-backup');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function loadState(){
  let serverState = null;
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value) serverState = JSON.parse(res.value);
  }catch(e){ console.error('Error leyendo el estado del servidor', e); }

  const backupState = tryRecoverLocalBackup();
  // Usamos lo que tenga la marca de tiempo más reciente: si el respaldo local es más nuevo
  // que lo que devolvió el servidor, significa que un guardado anterior falló y hay que
  // recuperar esos cambios (y volver a intentar guardarlos en el servidor).
  const serverTime = serverState && serverState.lastSavedAt || 0;
  const backupTime = backupState && backupState.lastSavedAt || 0;

  if(backupState && backupTime > serverTime){
    state = backupState;
    await saveState();
    try{ localStorage.removeItem(STORAGE_KEY + '-backup'); }catch(e){}
  } else if(serverState){
    state = serverState;
  } else {
    // IMPORTANTE: si no llegó ningún dato del servidor (ya sea porque es un usuario
    // realmente nuevo, o porque falló la lectura por un problema de red), NO guardamos
    // nada todavía. Antes esto pisaba con una lista vacía cualquier dato real que hubiera
    // en la planilla ante una falla transitoria de conexión — un guardado real solo debe
    // ocurrir cuando el usuario efectivamente hace algo (agregar tarea, lista, etc.).
    seedDefault();
    if(currentUserEmail && isSheetsConfigured()){
      showToast('No se encontraron datos guardados para este mail. Si ya tenías tareas cargadas, revisá tu conexión antes de agregar algo nuevo (para no perder nada).');
    }
  }
  migrateState();
  applyTheme();
  applySettingsToDOM();
  render();
  attachSwipeHandlers();
  attachDashboardScrollListener();
  renderReminderBanner();
  maybeShowWelcomeMessage();
  applyAutoThemeIfNeeded(); // no bloqueante: puede tardar por la geolocalización
}

/**
 * Mensaje de bienvenida: se muestra una sola vez, la primera vez que un usuario
 * (mail o navegador) entra a la app y no tiene ninguna tarea todavía. No agrega
 * datos de prueba — solo un saludo, y no vuelve a aparecer después.
 */
function maybeShowWelcomeMessage(){
  if(state.welcomeShown) return false;
  state.welcomeShown = true;
  if(state.tasks.length === 0){
    showToast('👋 ¡Bienvenido/a! Agregá tu primera tarea arriba para empezar.');
  }
  return true;
}

/** Rellena campos nuevos en estados guardados por versiones anteriores, sin tocar los existentes. */
function migrateState(){
  if(!state.currentView) state.currentView = {type:'list', id: state.lists[0] ? state.lists[0].id : null};
  if(typeof state.totalCompletedEver !== 'number') state.totalCompletedEver = state.tasks.filter(t=>t.done).length;
  if(typeof state.darkMode !== 'boolean') state.darkMode = false;
  if(state.themeMode !== 'auto' && state.themeMode !== 'manual') state.themeMode = 'auto';
  if(typeof state.hideCompleted !== 'boolean') state.hideCompleted = false;
  if(!state.settings) state.settings = {};
  const defaultSettings = {
    density: 'normal',          // 'normal' | 'compact'
    fontSize: 'normal',         // 'small' | 'normal' | 'large'
    smartHeaderScroll: false,   // header inteligente al hacer scroll (opt-in, ver nota)
    showProgressBar: true,
    showGreeting: true,
    showDescriptions: true,
    confirmBeforeDelete: false,
    autoExpandNotes: false,
    showReminders: true,
    showSmartListToasts: true,
    smartLists: { leer:true, peliculas:true, series:true, podcasts:true, videos:true, importantes:true, hoy:true, completadas:true }
  };
  Object.keys(defaultSettings).forEach(key=>{
    if(state.settings[key] === undefined) state.settings[key] = defaultSettings[key];
  });
  if(!state.settings.smartLists) state.settings.smartLists = defaultSettings.smartLists;
  Object.keys(defaultSettings.smartLists).forEach(key=>{
    if(state.settings.smartLists[key] === undefined) state.settings.smartLists[key] = true;
  });
  if(!state.focusSessions) state.focusSessions = [];
  if(typeof state.welcomeShown !== 'boolean'){
    // Si ya tenía tareas cargadas (usuario existente), no le mostramos el saludo de bienvenida.
    state.welcomeShown = state.tasks.length > 0;
  }
  // Renombrar listas existentes para agregarles emoji (sin duplicar, se ejecuta una sola vez por lista).
  const renameRules = [
    { test: l=> normalize(l.name)==='personal', name:'👤 Personal' },
    { test: l=> normalize(l.name)==='compras', name:'🛒 Compras' },
    { test: l=> normalize(l.name).includes('agenda') && !l.name.includes('📅'), name:'📅 Agenda' },
    { test: l=> normalize(l.name).includes('videos') && normalize(l.name).includes('youtube') && l.name.includes('🎥'), name:'▶️ Videos/YouTube' }
  ];
  renameRules.forEach(rule=>{
    const list = state.lists.find(rule.test);
    if(list) list.name = rule.name;
  });
  if(!state.lists.some(l=> normalize(l.name)==='ilce')){
    state.lists.push({ id: uid(), name:'ILCE', color:'#8a5fd6' });
  }
  if(!state.lists.some(l=> normalize(l.name).includes('agenda'))){
    state.lists.push({ id: uid(), name:'📅 Agenda', color:'#dd9012' });
  }
  const contentCategories = [
    { name:'📚 Leer', color:'#8b5e3c' },
    { name:'🎬 Películas', color:'#b3542f' },
    { name:'📺 Series', color:'#c14f8f' },
    { name:'🎧 Podcasts', color:'#2f9e5b' },
    { name:'▶️ Videos/YouTube', color:'#cc3333' },
    { name:'🏥 Turnos Médicos', color:'#d6455c' }
  ];
  contentCategories.forEach(cat=>{
    if(!state.lists.some(l=> normalize(l.name)===normalize(cat.name))){
      state.lists.push({ id: uid(), name: cat.name, color: cat.color });
    }
  });
  state.tasks.forEach((t,i)=>{
    if(typeof t.order !== 'number') t.order = i;
    if(typeof t.notes !== 'string') t.notes = '';
    if(!t.tags) t.tags = [];
    if(!t.subtasks) t.subtasks = [];
    if(t.recurrence === undefined) t.recurrence = null;
    if(t.reminderDaysBefore === undefined) t.reminderDaysBefore = null;
    if(t.completedAtTime === undefined) t.completedAtTime = null;
    if(!t.updatedAt) t.updatedAt = t.createdAt || Date.now();
    if(t.dueTime === undefined) t.dueTime = null;
    if(typeof t.readingProgress !== 'number') t.readingProgress = 0;
    if(t.currentEpisodeInfo === undefined) t.currentEpisodeInfo = null;
    if(typeof t.favorite !== 'boolean') t.favorite = false;
    if(t.youtubeUrl === undefined) t.youtubeUrl = null;
    if(t.youtubeTitle === undefined) t.youtubeTitle = null;
    if(t.youtubeThumbnail === undefined) t.youtubeThumbnail = null;
    if(t.youtubeAuthor === undefined) t.youtubeAuthor = null;
    if(!t.reminders){
      t.reminders = (t.reminderDaysBefore !== null && t.reminderDaysBefore !== undefined) ? [t.reminderDaysBefore] : [];
    }
  });
}

    try{ log = JSON.parse(localStorage.getItem(key)) || []; }catch(e){}

async function saveState(){
  state.lastSavedAt = Date.now();
  const payload = JSON.stringify(state);
  try{
    await storageSet(STORAGE_KEY, payload);
    logSyncEvent(true, 'Guardado OK');
  }catch(e){
    console.error('Error guardando (intento 1)', e);
    try{
      // Reintento simple por si fue un error transitorio del servidor
      await storageSet(STORAGE_KEY, payload);
      logSyncEvent(true, 'Guardado OK (reintento)');
    }catch(e2){
      console.error('Error guardando (intento 2, uso respaldo local)', e2);
      try{
        // Respaldo: guardamos localmente para no perder los cambios de esta sesión
        localStorage.setItem(STORAGE_KEY + '-backup', payload);
        logSyncEvent(false, 'Falló el guardado en el servidor — respaldado localmente');
        if(!saveFailureNotified){
          saveFailureNotified = true;
          showToast('El guardado en el servidor falló momentáneamente. Tus cambios quedaron respaldados en este navegador.');
        }
      }catch(e3){ console.error('Respaldo local también falló', e3); logSyncEvent(false, 'Falló también el respaldo local'); }
    }
  }
}

/* =====================================================================
   MODO OSCURO AUTOMÁTICO (según amanecer/atardecer real del lugar)
   ===================================================================== */
const BUENOS_AIRES_COORDS = { lat:-34.6037, lon:-58.3816 };

/** Cálculo de amanecer/atardecer (en horas UTC) para una fecha y coordenadas, fórmula NOAA simplificada. */
function computeSunTimesUTC(lat, lon, date){
  const rad = Math.PI/180;
  const dayOfYear = Math.floor((date - new Date(date.getFullYear(),0,0)) / 86400000);
  const lngHour = lon/15;
  function calc(isSunrise){
    const t = dayOfYear + ((isSunrise?6:18) - lngHour)/24;
    const M = (0.9856*t) - 3.289;
    let L = M + (1.916*Math.sin(M*rad)) + (0.020*Math.sin(2*M*rad)) + 282.634;
    L = (L+360)%360;
    let RA = (1/rad)*Math.atan(0.91764*Math.tan(L*rad));
    RA = (RA+360)%360;
    const Lquadrant = Math.floor(L/90)*90;
    const RAquadrant = Math.floor(RA/90)*90;
    RA = (RA + (Lquadrant - RAquadrant)) / 15;
    const sinDec = 0.39782*Math.sin(L*rad);
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833*rad) - (sinDec*Math.sin(lat*rad))) / (cosDec*Math.cos(lat*rad));
    if(cosH > 1 || cosH < -1) return null; // sol no sale o no se pone (latitudes extremas)
    let H = isSunrise ? (360 - (1/rad)*Math.acos(cosH)) : ((1/rad)*Math.acos(cosH));
    H = H/15;
    const T = H + RA - (0.06571*t) - 6.622;
    return ((T - lngHour) + 24) % 24;
  }
  return { sunriseUTC: calc(true), sunsetUTC: calc(false) };
}

function getLocationForTheme(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(BUENOS_AIRES_COORDS); return; }
    const timer = setTimeout(()=> resolve(BUENOS_AIRES_COORDS), 2500);
    navigator.geolocation.getCurrentPosition(
      pos=>{ clearTimeout(timer); resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
      ()=>{ clearTimeout(timer); resolve(BUENOS_AIRES_COORDS); },
      { timeout: 2000 }
    );
  });
}

/** Decide si debería estar en modo oscuro ahora mismo, según el sol, para el modo automático. */
async function computeAutoDarkMode(){
  try{
    const { lat, lon } = await getLocationForTheme();
    const now = new Date();
    const { sunriseUTC, sunsetUTC } = computeSunTimesUTC(lat, lon, now);
    if(sunriseUTC===null || sunsetUTC===null) return false;
    const nowUTC = now.getUTCHours() + now.getUTCMinutes()/60;
    const isDaytime = nowUTC >= sunriseUTC && nowUTC < sunsetUTC;
    return !isDaytime;
  }catch(e){ return false; }
}

/** Sonido suave y ambiental al pasar de claro a oscuro (o viceversa) automáticamente por el horario. */
function playThemeTransitionSound(toDark){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const now = ctx.currentTime;
    // Atardecer: arpegio descendente y cálido. Amanecer: arpegio ascendente y suave.
    const notes = toDark ? [783.99, 659.25, 523.25, 392.00] : [392.00, 523.25, 659.25, 783.99];
    notes.forEach((freq,i)=> playTone(ctx, freq, now + i*0.22, 0.9, 0.055));
  }catch(e){ /* si el audio falla, seguimos sin romper la app */ }
}

   SWIPE SOBRE TAREAS (mobile): derecha completa, izquierda revela editar/eliminar
   ===================================================================== */
let swipeState = null;

function closeSwipeReveal(wrapper){
  const inner = wrapper.querySelector('.task');
  if(inner){ inner.style.transition = 'transform .2s var(--ease)'; inner.style.transform = 'translateX(0)'; }
  wrapper.classList.remove('revealed','swipe-right-active');
}

function attachSwipeHandlers(){
  const container = document.getElementById('view-body');
  if(!container || container.dataset.swipeAttached) return;
  container.dataset.swipeAttached = '1';
  container.addEventListener('touchstart', onSwipeStart, { passive:true });
  container.addEventListener('touchmove', onSwipeMove, { passive:false });
  container.addEventListener('touchend', onSwipeEnd);
  document.addEventListener('touchstart', (e)=>{
    const open = document.querySelector('.task-swipe-wrapper.revealed');
    if(open && !open.contains(e.target)) closeSwipeReveal(open);
  });
  // Swipe horizontal sobre la grilla semanal del calendario (mobile) para cambiar de semana
  let calStartX = null;
  container.addEventListener('touchstart', (e)=>{
    if(e.target.closest('.week-grid') && !e.target.closest('.cal-task-chip')) calStartX = e.touches[0].clientX;
    else calStartX = null;
  }, { passive:true });
  container.addEventListener('touchend', (e)=>{
    if(calStartX===null) return;
    const dx = e.changedTouches[0].clientX - calStartX;
    if(Math.abs(dx) > 60) changeWeek(dx < 0 ? 1 : -1);
    calStartX = null;
  });
}
function onSwipeStart(e){
  const wrapper = e.target.closest('.task-swipe-wrapper');
  if(!wrapper) return;
  document.querySelectorAll('.task-swipe-wrapper.revealed').forEach(w=>{ if(w!==wrapper) closeSwipeReveal(w); });
  const touch = e.touches[0];
  swipeState = { wrapper, startX: touch.clientX, startY: touch.clientY, currentX:0, taskId: wrapper.dataset.taskId, moved:false };
}
function onSwipeMove(e){
  if(!swipeState) return;
  const touch = e.touches[0];
  const dx = touch.clientX - swipeState.startX;
  const dy = touch.clientY - swipeState.startY;
  if(!swipeState.moved && Math.abs(dy) > Math.abs(dx)) return; // scroll vertical, no interferir
  if(!swipeState.moved && Math.abs(dx) > 8) swipeState.moved = true;
  if(!swipeState.moved) return;
  e.preventDefault();
  const clamped = Math.max(-140, Math.min(90, dx));
  swipeState.currentX = clamped;
  const inner = swipeState.wrapper.querySelector('.task');
  inner.style.transition = 'none';
  inner.style.transform = `translateX(${clamped}px)`;
  swipeState.wrapper.classList.toggle('swipe-right-active', clamped > 40);
}
function onSwipeEnd(){
  if(!swipeState) return;
  const { wrapper, currentX, taskId, moved } = swipeState;
  const inner = wrapper.querySelector('.task');
  if(!moved){ swipeState = null; return; }
  inner.style.transition = 'transform .2s var(--ease)';
  inner.style.transform = 'translateX(0)';
  wrapper.classList.remove('swipe-right-active');
  if(currentX > 70){
    const cb = wrapper.querySelector('.checkbox');
    handleCompleteClick(taskId, { currentTarget: cb });
  } else if(currentX < -70){
    openTaskActionsSheet(taskId);
  }
  swipeState = null;
}

  draggedListId = null;

function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

/** Detecta si el texto sugiere claramente una categoría de contenido (ej. "leer" → 📚 Leer). */
const SMART_LIST_RULES = [
  { match: /\bleer\b/, listName: '📚 Leer', color:'#8b5e3c' },
  { match: /\bpelicula(s)?\b|\bfilm\b/, listName: '🎬 Películas', color:'#b3542f' },

  { match: /\bmedico(s)?\b|\bturno(s)?\b|\bdoctor(a)?\b|\bdentista\b|\bodontolog[oi](a)?\b|\boftalmolog[oi](a)?\b|\bvacuna(s)?\b|\bchequeo(s)?\b|\bclinico\b|\bcontrol medico\b/, listName: '🏥 Turnos Médicos', color:'#d6455c' },

];
function detectSmartListOverride(text){
  const norm = normalize(text);
  for(const rule of SMART_LIST_RULES){
    if(rule.match.test(norm)) return rule;
  }
  return null;
}

const MEDICAL_RECOMMENDATIONS = [

function renderMedicalRecommendations(listId){
  return `
    <div class="task-group-label">Recomendaciones</div>
    ${MEDICAL_RECOMMENDATIONS.map((rec,i)=>`
      <div class="task" style="cursor:default;">

/** Agenda un turno preventivo. Si es recurrente (años/meses), agrega también la próxima ocurrencia. */
function scheduleMedicalAppointment(listId, idx){
  const rec = MEDICAL_RECOMMENDATIONS[idx];
  if(!rec) return;
  let recurrence = null;
  if(rec.years) recurrence = { type:'every_x_years', interval: rec.years };
  else if(rec.months) recurrence = { type:'every_x_months', interval: rec.months };

  let maxOrder = Math.max(0, ...state.tasks.filter(t=>t.listId===listId).map(t=>t.order||0));
  maxOrder++;
  const firstTask = {
    id: uid(), listId, title: rec.title, done:false, priority:'media', tags:['salud'], subtasks:[],
    notes: rec.desc||'', dueDate: todayISO(), createdAt: Date.now(), completedAt:null, order:maxOrder,
    recurrence, reminderDaysBefore:null, reminders: recurrence ? [7] : []
  };
  state.tasks.push(firstTask);
  let added = 1;
  if(recurrence){
    const nextDate = computeNextDueDate(firstTask);
    maxOrder++;
    state.tasks.push({ ...firstTask, id: uid(), dueDate: nextDate, order:maxOrder });
    added = 2;
  }
  saveState(); render();
  showToast(added===2 ? `Se agendaron 2 turnos: "${rec.title}"` : `Turno agendado: "${rec.title}"`);
}

function detectSmartChips(text){
  const norm = normalize(text);
  let clean = text;
  let date = null, dateLabel = null;
  let priority = null, prioLabel = null;
  let time = null, timeLabel = null;
  const today = new Date();

  const timeMatch = norm.match(/\ba las (\d{1,2})(?::(\d{2}))?\s*(?:horas?|hs\.?)?\b/);
  if(timeMatch){
    const hour = parseInt(timeMatch[1]);
    const minute = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
    if(hour>=0 && hour<=23 && minute>=0 && minute<60){
      time = pad2(hour)+':'+pad2(minute);
      timeLabel = time;
      clean = clean.replace(/\ba las \d{1,2}(?::\d{2})?\s*(?:horas?|hs\.?)?\b/i, '');
    }
  }

  if(/\bayer\b/.test(norm)){
    const d = new Date(today); d.setDate(d.getDate()-1);
    date = toISO(d); dateLabel = 'ayer';
    clean = clean.replace(/\bayer\b/i, '');
  } else if(/\bhoy\b/.test(norm)){
    date = toISO(today); dateLabel = 'hoy';
    clean = clean.replace(/\bhoy\b/i, '');
  } else if(/\bmanana\b/.test(norm)){
    const d = new Date(today); d.setDate(d.getDate()+1);
    date = toISO(d); dateLabel = 'mañana';
    clean = clean.replace(/\bma[ñn]ana\b/i, '');
  } else {
    let matchedPastWeekday = false;
    for(let i=0;i<WEEKDAYS.length;i++){
      const wd = WEEKDAYS[i];
      const re = new RegExp('\\b'+wd+'\\s+pasado\\b');
      if(re.test(norm)){
        const d = new Date(today);
        let diff = (d.getDay() - i + 7) % 7;
        if(diff === 0) diff = 7;
        d.setDate(d.getDate()-diff);
        date = toISO(d); dateLabel = `${wd} ${d.getDate()}/${d.getMonth()+1} (pasado)`;
        const origRe = new RegExp('\\b'+wd.replace('miercoles','mi[ée]rcoles').replace('sabado','s[áa]bado')+'\\s+pasado\\b','i');
        clean = clean.replace(origRe, '');
        matchedPastWeekday = true;
        break;
      }
    }
    if(!matchedPastWeekday){
      const genericNextWeekQualifier = /\bsemana que viene\b|\bproxima semana\b|\bsemana proxima\b|\bsemana entrante\b/.test(norm);
      for(let i=0;i<WEEKDAYS.length;i++){
        const wd = WEEKDAYS[i];
        const re = new RegExp('\\b'+wd+'\\b');
        if(re.test(norm)){
          const wdNextViene = new RegExp('\\b'+wd+'\\s+que viene\\b').test(norm);
          const nextWeekQualifier = genericNextWeekQualifier || wdNextViene;
          let d;
          if(nextWeekQualifier){
            // "de la semana que viene" / "<día> que viene": ir al domingo de la próxima semana calendario y sumar el offset del día
            const dow = today.getDay();
            const thisWeekStart = new Date(today); thisWeekStart.setDate(today.getDate() - dow);
            const nextWeekStart = new Date(thisWeekStart); nextWeekStart.setDate(thisWeekStart.getDate()+7);
            d = new Date(nextWeekStart); d.setDate(nextWeekStart.getDate()+i);
          } else {
            d = new Date(today);
            let diff = (i - d.getDay() + 7) % 7;
            if(diff === 0) diff = 7;
            d.setDate(d.getDate()+diff);
          }
          date = toISO(d);
          dateLabel = `${wd} ${d.getDate()}/${d.getMonth()+1}${nextWeekQualifier?' (semana que viene)':''}`;
          const origRe = new RegExp('\\b'+wd.replace('miercoles','mi[ée]rcoles').replace('sabado','s[áa]bado')+'\\b','i');
          clean = clean.replace(origRe, '');
          clean = clean.replace(/\bde la semana que viene\b|\bde la proxima semana\b|\bde la semana proxima\b|\bde la semana entrante\b|\bsemana que viene\b|\bproxima semana\b|\bsemana proxima\b|\bsemana entrante\b|\bque viene\b/i, '');
          break;
        }
      }
    }
  }

  if(/\bno urgente\b/.test(norm) || /\bprioridad baja\b/.test(norm) || /\bbaja prioridad\b/.test(norm)){
    priority = 'baja'; prioLabel = 'baja';
    clean = clean.replace(/\bno urgente\b/i,'').replace(/\bprioridad baja\b/i,'').replace(/\bbaja prioridad\b/i,'');
  } else if(/\bprioridad media\b/.test(norm) || /\bmedia prioridad\b/.test(norm)){
    priority = 'media'; prioLabel = 'media';
    clean = clean.replace(/\bprioridad media\b/i,'').replace(/\bmedia prioridad\b/i,'');
  } else if(/\burgente\b/.test(norm) || /\bprioridad alta\b/.test(norm) || /\balta prioridad\b/.test(norm)){
    priority = 'alta'; prioLabel = 'alta';
    clean = clean.replace(/\burgente\b/i,'').replace(/\bprioridad alta\b/i,'').replace(/\balta prioridad\b/i,'');
  }
  clean = clean.replace(/\s{2,}/g,' ').replace(/^[\s:,-]+|[\s:,-]+$/g,'').trim();
  clean = clean.replace(/\s+\b(el|la|del|al)\b$/i, '').trim();
  return { clean, date, dateLabel, priority, prioLabel, time, timeLabel };
}

/** Heurística local (sin IA) de similitud por superposición de palabras — instantánea y gratis. */
function findSimilarTask(title, excludeId){
  const words = new Set(normalize(title).split(/\s+/).filter(w=>w.length>3));
  if(words.size===0) return null;
  let best = null, bestScore = 0;
  state.tasks.forEach(t=>{
    if(t.id===excludeId || t.done) return;
    const tWords = new Set(normalize(t.title).split(/\s+/).filter(w=>w.length>3));
    if(tWords.size===0) return;
    let overlap = 0;
    words.forEach(w=>{ if(tWords.has(w)) overlap++; });
    const score = overlap / Math.max(words.size, tWords.size);
    if(score > bestScore){ bestScore = score; best = t; }
  });
  return bestScore >= 0.6 ? best : null;
}

function computeNextDueDate(task){
  const base = task.dueDate ? new Date(task.dueDate+'T00:00:00') : new Date();
  const r = task.recurrence;
  if(!r) return null;
  const d = new Date(base);
  if(r.type === 'daily') d.setDate(d.getDate()+1);
  else if(r.type === 'weekly') d.setDate(d.getDate()+7);
  else if(r.type === 'monthly') d.setMonth(d.getMonth()+1);
  else if(r.type === 'every_x') d.setDate(d.getDate()+(r.interval||1));
  else if(r.type === 'every_x_months') d.setMonth(d.getMonth()+(r.interval||1));
  else if(r.type === 'every_x_years') d.setFullYear(d.getFullYear()+(r.interval||1));
  return toISO(d);
}

   SONIDO AL COMPLETAR (generado con Web Audio API, sin archivos externos)
   ===================================================================== */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(ctx, freq, startTime, duration, gainValue){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainValue, startTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime + duration);
}
/** Sonido de "completado" que evoluciona según cuántas tareas llevás: 1-5 simple, 6-10 acorde, 11+ fanfarria. */
/** Vibración corta (solo funciona en navegadores compatibles, ej. Chrome Android; Safari/iOS no la soporta). */
function haptic(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

function playCompletionSound(totalCompleted){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const now = ctx.currentTime;
    let notes;
    if(totalCompleted <= 5) notes = [659.25, 880.00];
    else if(totalCompleted <= 10) notes = [523.25, 659.25, 783.99];
    else notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq,i)=> playTone(ctx, freq, now + i*0.09, 0.22, 0.13));
  }catch(e){ /* si el audio falla, seguimos sin romper la app */ }
}

function toggleTask(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  t.done = !t.done;
  if(t.done){
    t.completedAt = todayISO();
    t.completedAtTime = Date.now();
    state.totalCompletedEver = (state.totalCompletedEver||0) + 1;
    if(t.recurrence){
      const nextDate = computeNextDueDate(t);
      state.tasks.push({
        id: uid(), listId: t.listId, title: t.title, done:false, priority: t.priority,
        tags: [...t.tags], subtasks: t.subtasks.map(s=>({id:uid(), title:s.title, done:false})),
        notes: t.notes, dueDate: nextDate, createdAt: Date.now(), completedAt: null, completedAtTime: null,
        order: t.order, recurrence: t.recurrence, reminderDaysBefore: t.reminderDaysBefore,
        reminders: [...(t.reminders||[])], estimatedMinutes: t.estimatedMinutes||null
      });
    }
    const milestone = state.totalCompletedEver % 20 === 0;
    playCompletionSound(state.totalCompletedEver);
    saveState(); render(); renderReminderBanner();
    if(milestone) showCelebration(state.totalCompletedEver);
    return;
  } else {
    t.completedAt = null;
    t.completedAtTime = null;
  }
  saveState(); render(); renderReminderBanner();
}

  const a = state.tasks.find(t=>t.id===draggedTaskId);

  draggedTaskId = null;

function onSubDrop(evt, taskId, targetSubId){
  evt.preventDefault(); evt.stopPropagation();
  if(!draggedSubtask || draggedSubtask.taskId !== taskId) return;
  const t = state.tasks.find(t=>t.id===taskId);
  const fromIdx = t.subtasks.findIndex(s=>s.id===draggedSubtask.subId);
  const toIdx = t.subtasks.findIndex(s=>s.id===targetSubId);
  if(fromIdx===-1||toIdx===-1) return;
  const [moved] = t.subtasks.splice(fromIdx,1);
  t.subtasks.splice(toIdx,0,moved);
  draggedSubtask = null;
  saveState(); render();
}

  const d = new Date(ts);

  const dISO = toISO(d);

function exportTasksJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `mis-tareas-backup-${todayISO()}.json`;

function restoreFromFile(input){
  const file = input.files[0];
  if(!file) return;
  if(!confirm('Esto va a reemplazar todo lo que ves ahora por el contenido del archivo. ¿Continuar?')) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      state = JSON.parse(reader.result);
      migrateState();
      render();
      saveState();
      closeModal();
      showToast('Datos restaurados desde el archivo');
    }catch(e){ alert('El archivo no es un backup válido de esta app.'); }
  };
  reader.readAsText(file);
}

async function restoreFromCloud(){
  if(!currentUserEmail || !isSheetsConfigured()){ alert('No hay una cuenta con mail conectada a la nube.'); return; }
  if(!confirm('Esto va a reemplazar lo que ves ahora por la última versión guardada en la nube. ¿Continuar?')) return;
  try{
    const value = await sheetsGet(currentUserEmail);
    if(!value){
      if(!confirm('No hay datos guardados en la nube para este mail (probablemente se haya borrado). ¿Reiniciar este navegador a un estado vacío igualmente?')) return;
      seedDefault();
    } else {
      state = JSON.parse(value);
    }
    migrateState();
    // Importante: borramos también el respaldo local de este navegador. Si no,
    // la próxima vez que se abra la app, ese respaldo viejo podría "resucitar"
    // datos que ya no deberían existir.
    try{ localStorage.removeItem(STORAGE_KEY + '-backup'); }catch(e){}
    await saveState();
    render();
    closeModal();
    showToast('Restaurado desde la nube');
  }catch(e){ alert('No se pudo restaurar desde la nube. Probá de nuevo.'); }
}
function restoreFromLocalBackup(){
  const raw = (()=>{ try{ return localStorage.getItem(STORAGE_KEY+'-backup'); }catch(e){ return null; } })();

  if(!confirm('Esto va a reemplazar lo que ves ahora por la copia local de respaldo. ¿Continuar?')) return;
  state = JSON.parse(raw);
  migrateState();
  render();
  saveState();
  closeModal();
  showToast('Restaurado desde la copia local');
}

/* =====================================================================

   ===================================================================== */
function isOverdue(t){ return t.dueDate && t.dueDate < todayISO() && !t.done; }
function isThisWeek(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  const end = new Date(start); end.setDate(start.getDate()+6);
  return d >= new Date(start.toDateString()) && d <= new Date(end.toDateString());
}

function getVisibleTasks(){
  const v = state.currentView;
  const t0 = todayISO();
  if(v.type === 'today') return state.tasks.filter(t=> t.dueDate===t0 || isOverdue(t));
  if(v.type === 'tomorrow') return state.tasks.filter(t=> t.dueDate===tomorrowISO());
  if(v.type === 'important') return state.tasks.filter(t=> t.priority === 'alta');
  if(v.type === 'favorites') return state.tasks.filter(t=> t.favorite);
  if(v.type === 'filter'){
    if(v.id === 'overdue') return state.tasks.filter(isOverdue);
    if(v.id === 'week') return state.tasks.filter(t=>!t.done && isThisWeek(t.dueDate));
    if(v.id === 'nodate') return state.tasks.filter(t=>!t.done && !t.dueDate);
    if(v.id === 'pending') return state.tasks.filter(t=>!t.done);
    if(v.id === 'completed') return state.tasks.filter(t=>t.done);
  }
  if(v.type === 'list') return state.tasks.filter(t=> t.listId === v.id);
  return [];
}
